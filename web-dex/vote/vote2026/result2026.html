<!DOCTYPE html>
<html lang="en" class="result-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Top of the Favorite Creature - 2026 | CreatureMatsu</title>
  <link rel="icon" type="image/png" href="/images/icon.png">
  <link rel="stylesheet" href="/vote/vote2026/result2026.css?v=20261107-first-place-grow-upward-all">
  <script>
    window.addEventListener("load", () => {
      const fontsReady = document.fonts?.ready || Promise.resolve();
      Promise.resolve(fontsReady).finally(() => {
        requestAnimationFrame(() => document.documentElement.classList.remove("result-loading"));
      });
    }, { once: true });
  </script>
</head>

<body>
  <div class="result-background" aria-hidden="true">
    <span class="background-shape shape-1"></span>
    <span class="background-shape shape-2"></span>
    <span class="background-shape shape-3"></span>
    <span class="background-shape shape-4"></span>
    <span class="background-shape shape-5"></span>
    <span class="background-shape shape-6"></span>
    <span class="background-shape shape-7"></span>
    <span class="background-shape shape-8"></span>
  </div>

  <main class="result-page">
    <section class="album-dialog" aria-labelledby="resultTitle">
      <div class="album-dialog-inner">
        <header class="result-header">
          <p class="result-kicker">2026 COLLECTION</p>
          <h1 id="resultTitle">Top of the Favorite Creature</h1>
        </header>

        <div id="resultState" class="result-state" role="status" aria-live="polite">
          <p id="resultStateText">Preparing the result album...</p>
        </div>

        <section id="albumSheet" class="album-sheet is-awaiting-reveal" aria-label="Top six result album" hidden>
          <article class="result-slot result-slot-first" data-place="1">
            <div class="sticker-stage" data-sticker-stage></div>
            <p class="result-points" data-points></p>
            <p class="winner-message" data-winner-message></p>
          </article>

          <article class="result-slot result-slot-2" data-place="2">
            <div class="sticker-stage" data-sticker-stage></div>
            <p class="result-points" data-points></p>
          </article>

          <article class="result-slot result-slot-3" data-place="3">
            <div class="sticker-stage" data-sticker-stage></div>
            <p class="result-points" data-points></p>
          </article>

          <article class="result-slot result-slot-4" data-place="4">
            <div class="sticker-stage" data-sticker-stage></div>
            <p class="result-points" data-points></p>
          </article>

          <article class="result-slot result-slot-5" data-place="5">
            <div class="sticker-stage" data-sticker-stage></div>
            <p class="result-points" data-points></p>
          </article>

          <article class="result-slot result-slot-6" data-place="6">
            <div class="sticker-stage" data-sticker-stage></div>
            <p class="result-points" data-points></p>
          </article>

          <aside id="resultSummary" class="result-summary" aria-label="Voting summary">
            <span class="summary-spark" aria-hidden="true">✦</span>
            <strong id="summaryParticipants" class="summary-participants">
              <span id="summaryParticipantCount" class="summary-participant-count">0</span>
              <span id="summaryParticipantLabel" class="summary-participant-label">participants</span>
            </strong>
            <div class="summary-vote-details">
              <span id="summaryCreatures">0 creatures received votes</span>
              <span id="summaryPoints">0 total points</span>
            </div>
            <button id="summaryNoVotesButton" class="summary-no-votes-button" type="button">
              Creatures Without Votes
            </button>
          </aside>

          <div id="revealPanel" class="reveal-panel">
            <p>The votes are in.<br>Reveal the 2026 results!</p>
            <button id="revealResultsButton" type="button">REVEAL RESULTS</button>
          </div>
        </section>
      </div>
    </section>
  </main>

  <dialog id="resultDetailsDialog" class="result-details-dialog" aria-labelledby="resultDialogTitle">
    <div class="dialog-panel">
      <button id="resultDialogClose" class="dialog-close" type="button" aria-label="Close">×</button>
      <h2 id="resultDialogTitle"></h2>
      <div id="resultDialogContent" class="dialog-content"></div>
    </div>
  </dialog>

  <audio id="stickerSound" preload="auto" src="/games/matsu-quiz/audio/sfx/sticker-plap.wav"></audio>
  <audio id="medalSound" preload="auto" src="/games/matsu-quiz/audio/sfx/rank-tap.wav"></audio>

  <script src="/info-data/creature-data/first-pillar/worker.js"></script>
  <script src="/info-data/creature-data/first-pillar/combat.js"></script>
  <script src="/info-data/creature-data/first-pillar/craft.js"></script>
  <script src="/info-data/creature-data/first-pillar/tool.js"></script>
  <script src="/info-data/creature-data/first-pillar/status.js"></script>
  <script src="/info-data/creature-data/first-pillar/elemental.js"></script>
  <script src="/info-data/creature-data/second-pillar/2P-oso.js"></script>
  <script src="/info-data/creature-data/second-pillar/2P-kara.js"></script>
  <script src="/info-data/creature-data/second-pillar/2P-choro.js"></script>
  <script src="/info-data/creature-data/second-pillar/2P-ichi.js"></script>
  <script src="/info-data/creature-data/second-pillar/2P-jyushi.js"></script>
  <script src="/info-data/creature-data/second-pillar/2P-todo.js"></script>
  <script src="/audio/audio.js?v=20261019-mobile-start-retry"></script>
  <script src="/vote/vote2026/result2026.js?v=20261107-horizontal-only-tie-drag"></script>
</body>
</html>
