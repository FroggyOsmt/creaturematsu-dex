    const ungroupSelectedCanvasObjects = () => {
      const selectedObjects = getSelectedCanvasObjects();
      const selectedGroupIds = new Set(
        selectedObjects.map((object) => object.dataset.canvasGroupId).filter(Boolean)
      );
      if (selectedGroupIds.size === 0) return;

      getCanvasObjects().forEach((object) => {
        if (selectedGroupIds.has(object.dataset.canvasGroupId)) {
          delete object.dataset.canvasGroupId;
        }
      });
      setCanvasSelection(selectedObjects, getActiveCanvasObject());
      setTransformMode(true);
      recordCanvasState();
    };

    groupButton.addEventListener("click", groupSelectedCanvasObjects);
    ungroupButton.addEventListener("click", ungroupSelectedCanvasObjects);

    const mirrorActiveCanvasObject = (requiresTransform = true) => {
      const selectedObjects = getSelectedCanvasObjects();
      if (
        selectedObjects.length === 0 ||
        selectedObjects.some((object) =>
          ["free-text", "button"].includes(object.dataset.canvasObject)
        ) ||
        (requiresTransform && !isTransformEnabled())
      ) return;

      const bounds = getCanvasSelectionBounds(selectedObjects);
      selectedObjects.forEach((object) => {
        const left = Number.parseFloat(object.style.left);
        object.style.left = `${bounds.left + bounds.right - left - object.offsetWidth}px`;
        setObjectMirrored(object, !isObjectMirrored(object));
      });
      syncTransformControls();
      recordCanvasState();
    };

    mirrorButton.addEventListener("click", () => {
      mirrorActiveCanvasObject();
    });

    const moveCanvasObjectsByDelta = (objects, deltaX, deltaY) => {
      const bounds = getCanvasSelectionBounds(objects);
      if (!bounds) return { deltaX: 0, deltaY: 0 };

      const constrainedDeltaX = clamp(
        deltaX,
        -bounds.left,
        PC_CANVAS_WIDTH - bounds.right
      );
      const constrainedDeltaY = clamp(
        deltaY,
        -bounds.top,
        PC_CANVAS_HEIGHT - bounds.bottom
      );

      objects.forEach((selectedObject) => {
        selectedObject.style.left = `${
          Number.parseFloat(selectedObject.style.left) + constrainedDeltaX
        }px`;
        selectedObject.style.top = `${
          Number.parseFloat(selectedObject.style.top) + constrainedDeltaY
        }px`;
      });

      return { deltaX: constrainedDeltaX, deltaY: constrainedDeltaY };
    };

    const getLinkedMovementObjects = (selectedObjects) => {
      const movementIds = new Set(selectedObjects.map(
        (selectedObject) => selectedObject.dataset.canvasObjectId
      ));
      const selectedBubbleIds = new Set(
        selectedObjects
          .filter((selectedObject) => selectedObject.dataset.canvasObject === "speech-bubble")
          .map((selectedObject) => selectedObject.dataset.canvasObjectId)
      );

      getCanvasObjects().forEach((canvasObject) => {
        if (
          canvasObject.dataset.canvasObject === "balloon-tail" &&
          selectedBubbleIds.has(canvasObject.dataset.parentBubbleId)
        ) {
          movementIds.add(canvasObject.dataset.canvasObjectId);
        }
      });

      return getCanvasObjects().filter((canvasObject) =>
        movementIds.has(canvasObject.dataset.canvasObjectId)
      );
    };

    const getLinkedBalloonTails = (bubbleObject) => {
      if (bubbleObject?.dataset.canvasObject !== "speech-bubble") return [];

      return getCanvasObjects().filter((canvasObject) =>
        canvasObject.dataset.canvasObject === "balloon-tail" &&
        canvasObject.dataset.parentBubbleId === bubbleObject.dataset.canvasObjectId
      );
    };

    const enableCanvasObjectDrag = (object) => {
      object.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;

        if (event.target.closest('[contenteditable="true"]')) {
          if (object.dataset.active !== "true") setActiveCanvasObject(object);
          setTransformMode(false);
          updateHistoryButtons();
          return;
        }

        event.preventDefault();
        if (event.shiftKey) {
          setActiveCanvasObject(object, true);
          setTransformMode(getSelectedCanvasObjects().length > 0);
          updateHistoryButtons();
          return;
        }

        if (object.dataset.active === "true") {
          setCanvasSelection(getSelectedCanvasObjects(), object);
        } else {
          setActiveCanvasObject(object);
        }
        setTransformMode(true);
        updateHistoryButtons();

        const stageBounds = editorStage.getBoundingClientRect();
        const scale = stageBounds.width / PC_CANVAS_WIDTH;
        const startX = event.clientX;
        const startY = event.clientY;
        const useMagnet = isMagnetEnabled();
        const selectedObjects = getSelectedCanvasObjects();
        const movingObjects = getLinkedMovementObjects(selectedObjects);
        let selectionBounds = getCanvasSelectionBounds(movingObjects);

        if (useMagnet) {
          const initialPosition = getCanvasObjectPosition(
            selectionBounds.centerX,
            selectionBounds.centerY,
            selectionBounds.width,
            selectionBounds.height,
            true
          );
          moveCanvasObjectsByDelta(
            movingObjects,
            initialPosition.left - selectionBounds.left,
            initialPosition.top - selectionBounds.top
          );
          selectionBounds = getCanvasSelectionBounds(movingObjects);
          syncTransformControls();
          showMagnetGuide(
            initialPosition.snapped,
            selectedObjects.length === 1 ? object : null
          );
        } else {
          hideMagnetGuide();
        }

        const startPositions = movingObjects.map((selectedObject) => ({
          object: selectedObject,
          left: Number.parseFloat(selectedObject.style.left),
          top: Number.parseFloat(selectedObject.style.top)
        }));
        movingObjects.forEach((selectedObject) => selectedObject.classList.add("is-dragging"));
        document.body.dataset.draggingObject = "true";

        const moveObject = (moveEvent) => {
          if (moveEvent.pointerId !== event.pointerId) return;

          const position = getCanvasObjectPosition(
            selectionBounds.centerX + (moveEvent.clientX - startX) / scale,
            selectionBounds.centerY + (moveEvent.clientY - startY) / scale,
            selectionBounds.width,
            selectionBounds.height,
            useMagnet
          );

          const deltaX = position.left - selectionBounds.left;
          const deltaY = position.top - selectionBounds.top;
          startPositions.forEach((startPosition) => {
            startPosition.object.style.left = `${startPosition.left + deltaX}px`;
            startPosition.object.style.top = `${startPosition.top + deltaY}px`;
          });
          syncTransformControls();
          if (position.snapped) {
            showMagnetGuide(
              position.snapped,
              selectedObjects.length === 1 ? object : null
            );
          }
        };

        const finishObjectDrag = (finishEvent) => {
          if (finishEvent.pointerId !== event.pointerId) return;

          movingObjects.forEach((selectedObject) => selectedObject.classList.remove("is-dragging"));
          delete document.body.dataset.draggingObject;
          hideMagnetGuide();
          syncTransformControls();
          recordCanvasState();
          window.removeEventListener("pointermove", moveObject);
          window.removeEventListener("pointerup", finishObjectDrag);
          window.removeEventListener("pointercancel", finishObjectDrag);
        };

        window.addEventListener("pointermove", moveObject);
        window.addEventListener("pointerup", finishObjectDrag);
        window.addEventListener("pointercancel", finishObjectDrag);
      });
    };

    const createTestImage = (

    const maskObjectDefaults = {
      circle: { width: 340, height: 340, label: "Círculo" },
      square: { width: 340, height: 340, label: "Cuadrado" },
      triangle: { width: 460, height: 360, label: "Triángulo" }
    };

    const createMaskObject = (
      shape,

      top = null,

      height = null,
      rotation = 0,
      mirrored = false,
      objectId = null,
      activate = true,
      blur = 0,
      rounding = 0
    ) => {
      const defaults = maskObjectDefaults[shape];
      if (!defaults) return null;

      const objectWidth = width ?? defaults.width;

      maskObject.dataset.maskBlur = String(clamp(Number(blur) || 0, 0, 100));
      maskObject.dataset.maskRounding = String(

      maskObject.style.left = `${objectLeft}px`;
      maskObject.style.top = `${objectTop}px`;

      maskObject.style.height = `${objectHeight}px`;

    const createFreeTextObject = (

      objectId = null,

    ) => {

        rememberActiveTextSelection();
      });
      freeTextContent.addEventListener("input", () => {

      freeTextContent.addEventListener("blur", (event) => {

    const createButtonObject = (
      left = null,
      top = null,
      width = BUTTON_DEFAULT_WIDTH,
      height = BUTTON_DEFAULT_HEIGHT,
      objectId = null,
      activate = true,
      text = "TEXTO",
      fontSize = DEFAULT_BUTTON_FONT_SIZE,
      html = null
    ) => {
      const objectWidth = Math.max(BUTTON_MIN_WIDTH, width ?? BUTTON_DEFAULT_WIDTH);
      const objectHeight = height ?? BUTTON_DEFAULT_HEIGHT;
      const position = getCanvasObjectPosition(
        left ?? PC_CANVAS_WIDTH / 2,
        top ?? PC_CANVAS_HEIGHT / 2,
        objectWidth,
        objectHeight,
        isMagnetEnabled()
      );
      const objectLeft = left ?? position.left;
      const objectTop = top ?? position.top;
      const buttonObject = document.createElement("div");
      const buttonText = document.createElement("span");
      const initialText = String(text ?? "TEXTO");

      buttonObject.className = "canvas-object canvas-button-object";
      buttonObject.dataset.canvasObject = "button";
      buttonObject.dataset.canvasObjectId = objectId || `button-${nextCanvasObjectId++}`;
      buttonObject.dataset.buttonText = initialText;
      buttonObject.dataset.textFontSize = String(
        normalizeTextFontSize(fontSize, DEFAULT_BUTTON_FONT_SIZE)
      );
      buttonObject.setAttribute("aria-label", "Botón dentro del Editor");

      buttonText.className = "canvas-button-text canvas-editable-text";

    const createBalloonTailObject = (
      type,
      parentBubbleId = null,
      left = null,
      top = null,
      width = null,
      height = null,
      rotation = 0,
      mirrored = false,
      objectId = null,
      activate = true
    ) => {
      const defaults = balloonTailDefaults[type];
      if (!defaults) return null;

      const svgNamespace = "http://www.w3.org/2000/svg";
      const parentBubble = parentBubbleId
        ? getCanvasObjects().find((object) => object.dataset.canvasObjectId === parentBubbleId)
        : null;
      const objectWidth = width ?? defaults.width;
      const objectHeight = height ?? defaults.height;
      const fallbackLeft = (PC_CANVAS_WIDTH - objectWidth) / 2;
      const fallbackTop = (PC_CANVAS_HEIGHT - objectHeight) / 2;
      let objectLeft = left;
      let objectTop = top;

      if (objectLeft === null || objectTop === null) {
        if (parentBubble) {
          const parentLeft = Number.parseFloat(parentBubble.style.left);
          const parentTop = Number.parseFloat(parentBubble.style.top);
          const parentCenterX = parentLeft + parentBubble.offsetWidth / 2;
          const parentCenterY = parentTop + parentBubble.offsetHeight / 2;
          let attachmentX = parentCenterX;
          let attachmentY = parentCenterY;

          if (type === "thought") {
            const radians = Number(rotation) * Math.PI / 180;
            const directionX = Math.cos(radians);
            const directionY = Math.sin(radians);
            const radiusX = parentBubble.offsetWidth / 2;
            const radiusY = parentBubble.offsetHeight / 2;
            const boundaryDistance = 1 / Math.sqrt(
              (directionX * directionX) / (radiusX * radiusX) +
              (directionY * directionY) / (radiusY * radiusY)
            );
            const attachmentDistance = boundaryDistance * 0.88;
            attachmentX += directionX * attachmentDistance;
            attachmentY += directionY * attachmentDistance;
          }

          const baseLocalX = defaults.baseX / defaults.viewBoxWidth * objectWidth - objectWidth / 2;
          const baseLocalY = defaults.baseY / defaults.viewBoxHeight * objectHeight - objectHeight / 2;
          const rotatedBase = rotateVector(baseLocalX, baseLocalY, Number(rotation));
          const objectCenterX = attachmentX - rotatedBase.x;
          const objectCenterY = attachmentY - rotatedBase.y;
          objectLeft = objectCenterX - objectWidth / 2;
          objectTop = objectCenterY - objectHeight / 2;

          objectLeft = fallbackLeft;
          objectTop = fallbackTop;

      tailObject.style.top = `${objectTop}px`;

    window.addEventListener("matsu:update-object-preference", (event) => {

        : clamp(Number(event.detail?.value) || 0, 0, 100);
      if (!["blur", "rounding", "seed"].includes(preference)) return;

      const applicableObjects = getSelectedCanvasObjects().filter((object) => {

          if (preference === "blur") return true;
          return preference === "rounding" && object.dataset.maskShape !== "circle";

    const rotateVector = (x, y, rotation) => {
      const radians = rotation * Math.PI / 180;
      const cosine = Math.cos(radians);
      const sine = Math.sin(radians);
      return {
        x: x * cosine - y * sine,
        y: x * sine + y * cosine
      };
    };

    const scaleDirections = {
      nw: { x: -1, y: -1 },
      n: { x: 0, y: -1 },
      ne: { x: 1, y: -1 },
      e: { x: 1, y: 0 },
      se: { x: 1, y: 1 },
      s: { x: 0, y: 1 },
      sw: { x: -1, y: 1 },

    };

    const preservesCircleAspectRatio = (object) =>

    const getBalloonTailBasePoint = (object) => {
      const defaults = balloonTailDefaults[object.dataset.balloonTailType];
      const width = object.offsetWidth;
      const height = object.offsetHeight;
      const centerX = Number.parseFloat(object.style.left) + width / 2;
      const centerY = Number.parseFloat(object.style.top) + height / 2;
      const baseLocalX = defaults.baseX / defaults.viewBoxWidth * width - width / 2;
      const baseLocalY = defaults.baseY / defaults.viewBoxHeight * height - height / 2;
      const rotatedBase = rotateVector(
        baseLocalX,
        baseLocalY,
        getObjectRotation(object)
      );
      return {
        x: centerX + rotatedBase.x,
        y: centerY + rotatedBase.y
      };
    };

    const startBalloonTailTipTransform = (event, object) => {
      const defaults = balloonTailDefaults[object.dataset.balloonTailType];
      const basePoint = getBalloonTailBasePoint(object);
      const startHeight = object.offsetHeight;
      const tipSpanRatio = (defaults.tipX - defaults.baseX) / defaults.viewBoxWidth;
      const preservesRatio = object.dataset.balloonTailType === "thought";

      document.body.dataset.transformAction = "tail-tip";

      const moveTailTip = (moveEvent) => {
        if (moveEvent.pointerId !== event.pointerId) return;

        const pointer = getStagePoint(moveEvent.clientX, moveEvent.clientY);
        const pointerX = pointer.x - basePoint.x;
        const pointerY = pointer.y - basePoint.y;
        let angle = Math.atan2(pointerY, pointerX) * 180 / Math.PI;
        if (moveEvent.shiftKey) angle = Math.round(angle / 45) * 45;

        let width = Math.max(MIN_TRANSFORM_SIZE, Math.hypot(pointerX, pointerY) / tipSpanRatio);
        let height = startHeight;
        if (preservesRatio) {
          const minimumScale = Math.max(
            MIN_TRANSFORM_SIZE / defaults.width,
            MIN_TRANSFORM_SIZE / defaults.height
          );
          const maximumScale = Math.min(
            PC_CANVAS_WIDTH / defaults.width,
            PC_CANVAS_HEIGHT / defaults.height
          );
          const scale = clamp(width / defaults.width, minimumScale, maximumScale);
          width = defaults.width * scale;
          height = defaults.height * scale;
        } else {
          width = clamp(width, MIN_TRANSFORM_SIZE, PC_CANVAS_WIDTH);
        }

        const baseLocalX = defaults.baseX / defaults.viewBoxWidth * width - width / 2;
        const baseLocalY = defaults.baseY / defaults.viewBoxHeight * height - height / 2;
        const rotatedBase = rotateVector(baseLocalX, baseLocalY, angle);
        const centerX = basePoint.x - rotatedBase.x;
        const centerY = basePoint.y - rotatedBase.y;

        object.style.left = `${centerX - width / 2}px`;
        object.style.top = `${centerY - height / 2}px`;
        object.style.width = `${width}px`;
        object.style.height = `${height}px`;
        setObjectRotation(object, angle);
        syncTransformControls();

            Math.max(minimumScaleX, minimumScaleY),

        if (moveEvent.pointerId !== event.pointerId) return;

        const editorBounds = editorCanvas.getBoundingClientRect();
        const isInsideEditor =
          moveEvent.clientX >= editorBounds.left &&
          moveEvent.clientX <= editorBounds.right &&
          moveEvent.clientY >= editorBounds.top &&
          moveEvent.clientY <= editorBounds.bottom;

        if (isMagnetEnabled() && isInsideEditor) {
          const stagePoint = getStagePoint(moveEvent.clientX, moveEvent.clientY);
          const position = getCanvasObjectPosition(
            stagePoint.x,
            stagePoint.y,
            TEST_IMAGE_SIZE,
            TEST_IMAGE_SIZE,
            true
          );
          preview.style.left = `${stagePoint.stageBounds.left + position.snapped.centerX * stagePoint.scale}px`;
          preview.style.top = `${stagePoint.stageBounds.top + position.snapped.centerY * stagePoint.scale}px`;
          showMagnetGuide(position.snapped);
        } else {
          preview.style.left = `${moveEvent.clientX}px`;
          preview.style.top = `${moveEvent.clientY}px`;
          hideMagnetGuide();
        }
      };

      const finishAssetDrag = (finishEvent) => {
        if (finishEvent.pointerId !== event.pointerId) return;

        const editorBounds = editorCanvas.getBoundingClientRect();
        const isInsideEditor =
          finishEvent.clientX >= editorBounds.left &&
          finishEvent.clientX <= editorBounds.right &&
          finishEvent.clientY >= editorBounds.top &&
          finishEvent.clientY <= editorBounds.bottom;

        if (isInsideEditor) {
          placeTestImage(finishEvent.clientX, finishEvent.clientY);
        }

        preview.remove();
        testToolAsset.classList.remove("is-dragging");
        delete document.body.dataset.draggingAsset;
        hideMagnetGuide();
        window.removeEventListener("pointermove", movePreview);
        window.removeEventListener("pointerup", finishAssetDrag);
        window.removeEventListener("pointercancel", finishAssetDrag);
      };

      window.addEventListener("pointermove", movePreview);
      window.addEventListener("pointerup", finishAssetDrag);
      window.addEventListener("pointercancel", finishAssetDrag);
    });

    document.querySelectorAll(".resize-handle").forEach((handle) => {
      handle.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;

        event.preventDefault();

        const target = handle.dataset.resize;
        const startX = event.clientX;
        const startY = event.clientY;
        const startLeftWidth = leftPanel.getBoundingClientRect().width;
        const startRightWidth = rightPanel.getBoundingClientRect().width;
        const startSequenceHeight = sequencePanel.getBoundingClientRect().height;
        const startActivationHeight = activationPanel.getBoundingClientRect().height;
        const resizeAxis = target === "sequence" || target === "activation" ? "vertical" : "horizontal";

        handle.classList.add("is-active");
        document.body.dataset.resizeAxis = resizeAxis;

        const resize = (moveEvent) => {
          if (moveEvent.pointerId !== event.pointerId) return;

          if (target === "left") {
            const maximum = layout.clientWidth - rightPanel.getBoundingClientRect().width - MIN_EDITOR_WIDTH;
            const width = clamp(startLeftWidth + moveEvent.clientX - startX, MIN_LEFT_WIDTH, maximum);
            root.style.setProperty("--left-panel-width", `${width}px`);
          }

          if (target === "right") {
            const maximum = layout.clientWidth - leftPanel.getBoundingClientRect().width - MIN_EDITOR_WIDTH;
            const width = clamp(startRightWidth - (moveEvent.clientX - startX), MIN_RIGHT_WIDTH, maximum);
            root.style.setProperty("--right-panel-width", `${width}px`);
          }

          if (target === "sequence") {
            const styles = getComputedStyle(root);
            const menuHeight = parseFloat(styles.getPropertyValue("--menu-height"));
            const commandHeight = parseFloat(styles.getPropertyValue("--command-height"));
            const maximum = layout.clientHeight - menuHeight - commandHeight - MIN_EDITOR_HEIGHT;
            const height = clamp(startSequenceHeight - (moveEvent.clientY - startY), MIN_SEQUENCE_HEIGHT, maximum);
            root.style.setProperty("--sequence-height", `${height}px`);
          }

          if (target === "activation") {
            const maximum = rightPanel.clientHeight - MIN_RIGHT_SECTION_HEIGHT;
            const height = clamp(
              startActivationHeight - (moveEvent.clientY - startY),
              MIN_RIGHT_SECTION_HEIGHT,
              maximum
            );
            root.style.setProperty("--right-activation-height", `${height}px`);
          }
        };

        const finishResize = (finishEvent) => {
          if (finishEvent.pointerId !== event.pointerId) return;

          handle.classList.remove("is-active");
          delete document.body.dataset.resizeAxis;
          window.removeEventListener("pointermove", resize);
          window.removeEventListener("pointerup", finishResize);
          window.removeEventListener("pointercancel", finishResize);
        };

        window.addEventListener("pointermove", resize);
        window.addEventListener("pointerup", finishResize);
        window.addEventListener("pointercancel", finishResize);
      });
    });

    if (
      "serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js");
      });
    }
  </script>
  <script src="./panels/herramientas.js?v=22"></script>
  <script src="./build.js?v=2"></script>
</body>
