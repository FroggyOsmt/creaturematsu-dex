<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111419">
  <meta name="application-name" content="Matsu Helper">
  <title>Matsu Helper · Editor</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/pwa-icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/pwa-icon-192.png">
  <link rel="preload" href="/fonts/hp_simplified_rg.ttf?v=1" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: "Inter";
      src: url("./fonts/Inter-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter";
      src: url("./fonts/Inter-SemiBold.woff2") format("woff2");
      font-style: normal;
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: "JetBrains Mono";
      src: url("./fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "JetBrains Mono";
      src: url("./fonts/JetBrainsMono-SemiBold.woff2") format("woff2");
      font-style: normal;
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: "Matsu HP Simplified";
      src: url("/fonts/hp_simplified_rg.ttf?v=1") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --menu-height: 44px;
      --command-height: 45px;
      --sequence-height: 156px;
      --sequence-bar-height: 40px;
      --right-activation-height: 50%;
      --left-panel-width: 310px;
      --right-panel-width: 310px;
      --editor-scale: 1;
      --grid-cell-size: 24px;
      --grid-color: rgb(102 130 158 / 25%);
      --grid-mark-thickness: 2px;
      --magnet-color: rgb(30 72 111 / 58%);
      --magnet-text: #3a6a97;
      --magnet-bubble-border-width: 2px;
      --coordinate-label-stroke: 0.45px;
      --transform-handle-size: 12px;
      --transform-line-width: 1px;
      --transform-rotate-offset: 34px;
      --page-background: #111216;
      --guide-menu: #1c2025;
      --guide-left: #22262b;
      --guide-commands: #22262b;
      --guide-editor: #191919;
      --guide-sequence: #22262b;
      --guide-right: #22262b;
      --guide-border: #474d58;
      --guide-text: #f3f6fb;
      --guide-muted: rgb(243 246 251 / 68%);
      --resize-line: #474d58;
      --resize-line-active: #4c525b;
      --resize-shadow: rgb(102 130 158 / 75%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 1120px;
      min-height: 700px;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: var(--page-background);
      color: var(--guide-text);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      font-weight: 400;
    }

    .editor-layout {
      display: grid;
      grid-template-areas:
        "menu menu menu"
        "left commands right"
        "left editor right"
        "left sequence right";
      grid-template-columns: var(--left-panel-width) minmax(480px, 1fr) var(--right-panel-width);
      grid-template-rows: var(--menu-height) var(--command-height) minmax(260px, 1fr) var(--sequence-height);
      width: 100%;
      height: 100%;
    }

    .editor-layout[data-command-bar-visible="false"] .command-bar {
      display: none;
    }

    .editor-layout[data-sequence-visible="false"] .sequence-panel {
      display: none;
    }

    .region {
      position: relative;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--guide-border);
    }

    .region-title {
      position: absolute;
      top: 14px;
      left: 16px;
      margin: 0;
      color: var(--guide-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      line-height: 1;
      text-transform: uppercase;
      user-select: none;
    }

    .menu-bar {
      display: flex;
      align-items: center;
      grid-area: menu;
      gap: 8px;
      padding: 5px 10px;
      background: var(--guide-menu);
      border-left: none;
      border-right: none;
      border-top: none;
    }

    .menu-button-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .menu-button-group-right {
      margin-left: auto;
    }

    .menu-button {
      height: 28px;
      padding: 0 9px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--guide-text);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: opacity 160ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease, transform 60ms ease;
    }

    .menu-button:hover {
      border-color: var(--guide-border);
      background: #292e34;
    }

    .menu-button[aria-haspopup="menu"] {
      opacity: 0.38;
    }

    .menu-button[aria-haspopup="menu"]:hover {
      opacity: 1;
    }

    .menu-button:active {
      background: var(--guide-editor);
      transform: translateY(1px);
    }

    .menu-button:focus-visible {
      outline: 2px solid #66829e;
      outline-offset: 2px;
    }

    .menu-button[aria-expanded="true"] {
      border-color: var(--guide-border);
      background: #292e34;
      box-shadow: 0 0 0 1px rgb(102 130 158 / 12%);
    }

    .menu-button:disabled {
      opacity: 0.38;
      cursor: default;
    }

    .menu-button:disabled:hover,
    .menu-button:disabled:active {
      border-color: transparent;
      background: transparent;
      transform: none;
    }

    .menu-button:disabled:hover {
      opacity: 1;
      border-color: var(--guide-border);
      background: #292e34;
      box-shadow: 0 0 0 1px rgb(102 130 158 / 12%);
    }

    .menu-separator {
      flex: 0 0 1.5px;
      width: 1.5px;
      height: 24px;
      margin: 0 4px;
      background: var(--guide-border);
      pointer-events: none;
    }

    .menu-button-shell {
      position: relative;
      display: flex;
      align-items: center;
    }

    .menu-dropdown {
      position: absolute;
      z-index: 1002;
      top: calc(100% + 0px);
      left: 0;
      width: 160px;
      overflow: hidden;
      border: 2px solid #5c6572;
      border-radius: 0 8px 8px 8px;
      background: var(--guide-menu);
      box-shadow: 0 9px 22px rgb(0 0 0 / 38%), 0 0 0 1px rgb(102 130 158 / 12%);
      transform-origin: top left;
    }

    .menu-dropdown[data-view-menu] {
      width: 160px;
    }

    .menu-dropdown[hidden] {
      display: none;
    }

    .menu-dropdown:not([hidden]) {
      animation: menu-dropdown-door-down 180ms ease-out both;
    }

    .menu-dropdown.is-closing {
      pointer-events: none;
      animation: menu-dropdown-fade-out 140ms ease-in both;
    }

    @keyframes menu-dropdown-door-down {
      from {
        opacity: 0.35;
        transform: perspective(420px) rotateX(-78deg);
      }

      to {
        opacity: 1;
        transform: perspective(420px) rotateX(0deg);
      }
    }

    @keyframes menu-dropdown-fade-out {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    .menu-dropdown-item {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      width: 100%;
      min-height: 28px;
      padding: 4px 8px;
      border: 0;
      border-bottom: 1px solid var(--guide-border);
      background: transparent;
      color: var(--guide-text);
      font: inherit;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .menu-dropdown-item:last-child {
      border-bottom: 0;
    }

    .menu-dropdown-item:hover,
    .menu-dropdown-item:focus-visible {
      background: #292e34;
      color: #ffffff;
      outline: none;
    }

    .menu-dropdown-item:disabled {
      color: var(--guide-muted);
      cursor: default;
      opacity: 0.38;
    }

    .menu-dropdown-item:disabled:hover {
      background: transparent;
    }

    .menu-dropdown-item[aria-pressed="false"] {
      color: var(--guide-muted);
      opacity: 0.38;
    }

    .menu-dropdown-item[aria-pressed="true"] {
      color: #ffffff;
      opacity: 1;
    }

    .menu-dropdown-item img {
      display: block;
      width: 16px;
      height: 16px;
      pointer-events: none;
      user-select: none;
    }

    .left-panel {
      display: grid;
      grid-area: left;
      grid-template-rows: repeat(3, minmax(0, 1fr));
      background: var(--guide-left);
      border-bottom: none;
      border-left: none;
    }

    .command-bar {
      display: flex;
      align-items: center;
      grid-area: commands;
      gap: 6px;
      padding: 7px 7px;
      background: var(--guide-commands);
      height: 45px;
    }

    .command-button {
      display: grid;
      flex: 0 0 auto;
      width: 30px;
      padding: 0;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--guide-border);
      border-radius: 4px;
      background: var(--guide-menu);
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease, transform 60ms ease;
    }

    .command-button:hover {
      border-color: #66829e;
      background: #292e34;
      box-shadow: 0 0 0 1px rgb(102 130 158 / 25%);
    }

    .command-button:active {
      background: var(--guide-editor);
      transform: translateY(1px);
    }

    .command-button[aria-pressed="true"] {
      border-color: #66829e;
      background: #292e34;
      box-shadow: 0 0 0 1px rgb(102 130 158 / 25%);
    }

    .command-button:focus-visible {
      outline: 2px solid #66829e;
      outline-offset: 2px;
    }

    .command-button:disabled {
      opacity: 0.38;
      cursor: default;
    }

    .command-button:disabled:hover,
    .command-button:disabled:active {
      border-color: var(--guide-border);
      background: var(--guide-menu);
      box-shadow: none;
      transform: none;
    }

    .command-button img {
      display: block;
      width: 22px;
      height: 22px;
      pointer-events: none;
      user-select: none;
    }

    .context-menu {
      position: fixed;
      z-index: 1000;
      width: 168px;
      overflow: hidden;
      border: 1px solid #5c6572;
      border-radius: 0 10px 10px 10px;
      background: var(--guide-menu);
      box-shadow: 0 10px 24px rgb(0 0 0 / 38%), 0 0 0 1px rgb(102 130 158 / 12%);
    }

    .context-menu[hidden] {
      display: none;
    }

    .context-menu:not([hidden]) {
      transform-origin: top left;
      animation: context-menu-pop-in 220ms ease-out both;
    }

    @keyframes context-menu-pop-in {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }

      72% {
        opacity: 1;
        transform: scale(1.015);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .context-menu-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 36px;
      padding: 5px 10px 5px 8px;
      border: 0;
      border-bottom: 1px solid var(--guide-border);
      background: transparent;
      color: var(--guide-text);
      font: inherit;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background-color 120ms ease, color 120ms ease;
    }

    .context-menu-item:last-child {
      border-bottom: 0;
    }

    .context-menu-item:hover,
    .context-menu-item:focus-visible {
      background: #292e34;
      color: #ffffff;
      outline: none;
    }

    .context-menu-item:active {
      background: var(--guide-editor);
    }

    .context-menu-item:disabled {
      color: var(--guide-muted);
      cursor: default;
      opacity: 0.38;
    }

    .context-menu-item:disabled:hover,
    .context-menu-item:disabled:active {
      background: transparent;
    }

    .context-menu-item img {
      display: block;
      width: 20px;
      height: 20px;
      pointer-events: none;
      user-select: none;
    }

    .command-tooltip {
      position: fixed;
      z-index: 1001;
      padding: 5px 9px;
      border: 1px solid #5c6572;
      border-radius: 0 8px 8px 8px;
      background: var(--guide-menu);
      box-shadow: 0 8px 20px rgb(0 0 0 / 38%), 0 0 0 1px rgb(102 130 158 / 12%);
      color: var(--guide-text);
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    .command-tooltip[hidden] {
      display: none;
    }

    .command-tooltip:not([hidden]) {
      animation: command-tooltip-fade-in 140ms ease-out both;
    }

    @keyframes command-tooltip-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .editor-canvas {
      grid-area: editor;
      overflow: hidden;
      background: var(--guide-editor);
    }

    .text-menu {
      position: absolute;
      z-index: 200;
      top: 8px;
      left: 8px;
      display: flex;
      align-items: center;
      gap: 3px;
      max-width: calc(100% - 16px);
      min-height: 34px;
      padding: 4px 6px;
      border: 1px solid #5c6572;
      border-radius: 8px;
      background: var(--guide-commands);
      box-shadow: 0 8px 18px rgb(0 0 0 / 34%), 0 0 0 1px rgb(102 130 158 / 12%);
    }

    .text-menu[hidden] {
      display: none;
    }

    .text-menu-button,
    .text-menu-icon-static {
      display: grid;
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--guide-border);
      border-radius: 5px;
      background: var(--guide-menu);
    }

    .text-menu-button {
      cursor: pointer;
    }

    .text-menu-button:hover:not(:disabled),
    .text-menu-button:focus-visible {
      border-color: #66829e;
      background: #292e34;
      outline: none;
      box-shadow: 0 0 0 1px rgb(102 130 158 / 25%);
    }

    .text-menu-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .text-menu-button[aria-pressed="true"] {
      border-color: #66829e;
      background: #292e34;
      box-shadow: 0 0 0 1px rgb(102 130 158 / 25%);
    }

    .text-menu-button:disabled {
      opacity: 0.38;
    }

    .text-menu-button img,
    .text-menu-icon-static img {
      display: block;
      width: 16px;
      height: 16px;
      pointer-events: none;
      user-select: none;
    }

    .text-menu-separator {
      flex: 0 0 1px;
      width: 1px;
      height: 20px;
      margin: 0 2px;
      background: var(--guide-border);
    }

    .text-menu-field-shell {
      position: relative;
      flex: 0 0 auto;
    }

    .text-menu-input {
      width: 38px;
      height: 24px;
      padding: 0 4px;
      border: 1px solid var(--guide-border);
      border-radius: 5px;
      background: #111418;
      color: #fff;
      font: 12px/1 "JetBrains Mono", Consolas, monospace;
      text-align: center;
      overflow: hidden;
      outline: none;
    }

    .text-menu-input:hover,
    .text-menu-input:focus {
      border-color: #66829e;
      box-shadow: 0 0 0 1px rgb(102 130 158 / 25%);
    }

    .text-menu-input:disabled {
      opacity: 0.38;
      pointer-events: none;
    }

    .text-menu-options {
      position: absolute;
      z-index: 210;
      top: calc(100% + 6px);
      left: 50%;
      display: grid;
      min-width: 48px;
      max-height: 210px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 4px;
      border: 1px solid #5c6572;
      border-radius: 8px;
      background: var(--guide-menu);
      box-shadow: 0 8px 18px rgb(0 0 0 / 38%);
      transform: translateX(-50%);
      scrollbar-width: thin;
      scrollbar-color: #66829e #111418;
    }

    .text-menu-options::-webkit-scrollbar {
      width: 6px;
      height: 0;
    }

    .text-menu-options::-webkit-scrollbar-track {
      border-radius: 999px;
      background: #111418;
    }

    .text-menu-options::-webkit-scrollbar-thumb {
      border: 1px solid #111418;
      border-radius: 999px;
      background: #66829e;
    }

    .text-menu-options::-webkit-scrollbar-thumb:hover {
      background: #8da9c4;
    }

    .text-menu-options[hidden] {
      display: none;
    }

    .text-menu-option {
      min-width: 38px;
      padding: 4px 7px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--guide-text);
      font: 12px/1.1 "JetBrains Mono", Consolas, monospace;
      cursor: pointer;
    }

    .text-menu-option:hover,
    .text-menu-option:focus-visible {
      background: #292e34;
      color: #fff;
      outline: none;
    }

    .text-color-palette {
      position: absolute;
      z-index: 220;
      top: calc(100% + 12px);
      left: 50%;
      width: max-content;
      min-width: 190px;
      overflow: hidden;
      border: 1px solid #5c6572;
      border-radius: 8px;
      background: var(--guide-menu);
      box-shadow: 0 8px 18px rgb(0 0 0 / 38%);
      transform: translateX(-50%);
    }

    .text-color-palette[hidden] {
      display: none;
    }

    .text-color-palette-row {
      display: grid;
      grid-template-columns: 44px auto;
      align-items: center;
      min-height: 27px;
      padding: 3px 5px;
      border-bottom: 1px solid #474d58;
    }

    .text-color-palette-row:last-child {
      border-bottom: 0;
    }

    .text-color-palette-label {
      position: relative;
      align-self: stretch;
      display: flex;
      align-items: center;
      padding-right: 6px;
      color: var(--guide-text);
      font: 12px/1 "Inter", "Segoe UI", sans-serif;
      white-space: nowrap;
    }

    .text-color-palette-label::after {
      position: absolute;
      top: 2px;
      right: 0;
      bottom: 2px;
      width: 1px;
      background: #474d58;
      content: "";
    }

    .text-color-palette-swatches {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 7px;
    }

    .text-color-swatch {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      padding: 0;
      border: 1px solid #474d58;
      border-radius: 50%;
      background: var(--text-color-swatch);
      appearance: none;
      box-sizing: border-box;
      cursor: pointer;
    }

    .text-color-swatch:hover,
    .text-color-swatch:focus,
    .text-color-swatch:focus-visible,
    .text-color-swatch:active,
    .text-color-swatch[aria-checked="true"] {
      border: 1px solid #474d58;
      outline: none;
      box-shadow: none;
    }

    .editor-stage {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1872px;
      height: 894px;
      border: 0;
      background: #0f0f0f;
      touch-action: none;
      transform: translate(-50%, -50%) scale(var(--editor-scale));
      transform-origin: center;
    }

    .editor-grid {
      position: absolute;
      z-index: 20;
      top: 15px;
      left: 0;
      width: 1872px;
      height: 864px;
      background-image:
        linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
      background-size: var(--grid-cell-size) var(--grid-cell-size);
      pointer-events: none;
    }

    .editor-grid::after {
      position: absolute;
      inset: 0;
      border-right: 1px solid var(--grid-color);
      border-bottom: 1px solid var(--grid-color);
      content: "";
    }

    .editor-grid-marks {
      position: absolute;
      z-index: 9;
      top: 15px;
      left: 0;
      width: 1872px;
      height: 864px;
      pointer-events: none;
    }

    .editor-grid-marks[hidden] {
      display: none;
    }

    .grid-center-cross,
    .grid-edge-mark {
      position: absolute;
      background: #2c333a;
    }

    .grid-center-cross {
      top: 50.05%;
      left: 50.05%;
      width: 28px;
      height: 28px;
      background: transparent;
      transform: translate(-50%, -50%);
    }

    .grid-center-cross::before,
    .grid-center-cross::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: #2c333a;
      content: "";
      transform: translate(-50%, -50%);
    }

    .grid-center-cross::before {
      width: 28px;
      height: var(--grid-mark-thickness);
    }

    .grid-center-cross::after {
      width: var(--grid-mark-thickness);
      height: 28px;
    }

    .grid-edge-mark-top,
    .grid-edge-mark-bottom {
      left: 50.05%;
      width: var(--grid-mark-thickness);
      height: 12px;
      transform: translateX(-50%);
    }

    .grid-edge-mark-top {
      top: 0;
    }

    .grid-edge-mark-bottom {
      bottom: 0;
    }

    .grid-edge-mark-left,
    .grid-edge-mark-right {
      top: 50.05%;
      width: 12px;
      height: var(--grid-mark-thickness);
      transform: translateY(-50%);
    }

    .grid-edge-mark-left {
      left: 0;
    }

    .grid-edge-mark-right {
      right: 0;
    }

    .magnet-guide {
      position: absolute;
      top: 0;
      left: 0;
      width: 1872px;
      height: 894px;
      pointer-events: none;
      --magnet-x: 936px;
      --magnet-y: 447px;
      --magnet-bubble-x: 1084.5px;
      --magnet-bubble-y: 298.5px;
    }

    .magnet-guide[hidden] {
      display: none;
    }

      top: 0;
      left: 0;
      cursor: nwse-resize;
    }

    .transform-handle-n {
      top: 0;
      left: 50%;
      cursor: ns-resize;
    }

    .transform-handle-ne {
      top: 0;
      left: 100%;
      cursor: nesw-resize;
    }

    .transform-handle-e {
      top: 50%;
      left: 100%;
      cursor: ew-resize;

    .transform-handle-se {

      left: 100%;
      cursor: nwse-resize;
    }

    .transform-handle-s {
      top: 100%;
      left: 50%;
      cursor: ns-resize;

    .transform-handle-sw {

      left: 0;
      cursor: nesw-resize;

    .transform-handle-w {

      left: 0;

  <script>
    const root = document.documentElement;

    const toolsMenuButton = document.querySelector('[data-menu-button="tools"]');

    const toolsMenuItems = Array.from(toolsMenu.querySelectorAll("[data-tools-command]"));
    const viewMenuShell = document.querySelector("[data-view-menu-shell]");
    const viewMenuButton = document.querySelector('[data-menu-button="view"]');
    const viewMenu = document.querySelector("[data-view-menu]");
    const viewMenuItems = Array.from(viewMenu.querySelectorAll("[data-view-command]"));
    const contextMenu = document.querySelector("[data-context-menu]");
    const contextMenuItems = Array.from(contextMenu.querySelectorAll("[data-context-command]"));
    const editorGrid = document.querySelector(".editor-grid");
    const editorGridMarks = document.querySelector(".editor-grid-marks");
    const magnetGuide = document.querySelector(".magnet-guide");
    const magnetCoordinateXLabel = magnetGuide.querySelector('[data-coordinate-label="x"]');
    const magnetCoordinateYLabel = magnetGuide.querySelector('[data-coordinate-label="y"]');

    const increaseTextButton = textMenu.querySelector('[data-text-command="increase"]');
    const decreaseTextButton = textMenu.querySelector('[data-text-command="decrease"]');
    const boldTextButton = textMenu.querySelector('[data-text-command="bold"]');
    const italicTextButton = textMenu.querySelector('[data-text-command="italic"]');
    const underlineTextButton = textMenu.querySelector('[data-text-command="underline"]');
    const bulletTextButton = textMenu.querySelector('[data-text-command="bullet"]');
    const quoteTextButton = textMenu.querySelector('[data-text-command="quote"]');
    const alignLeftTextButton = textMenu.querySelector('[data-text-command="align-left"]');
    const alignCenterTextButton = textMenu.querySelector('[data-text-command="align-center"]');
    const alignRightTextButton = textMenu.querySelector('[data-text-command="align-right"]');
    const textFormatButtons = [
      boldTextButton,
      italicTextButton,
      underlineTextButton,
      bulletTextButton,
      quoteTextButton
    ];
    const textAlignmentButtons = [
      alignLeftTextButton,
      alignCenterTextButton,
      alignRightTextButton
    ];

    const MIN_LEFT_WIDTH = 180;
    const MIN_RIGHT_WIDTH = 200;
    const MIN_EDITOR_WIDTH = 480;
    const MIN_EDITOR_HEIGHT = 260;
    const MIN_SEQUENCE_HEIGHT = 96;
    const MIN_RIGHT_SECTION_HEIGHT = 120;
    const PC_CANVAS_WIDTH = 1872;
    const PC_CANVAS_HEIGHT = 894;
    const GRID_CELL_SIZE = 24;
    const KEYBOARD_NUDGE_SIZE = 2;
    const GRID_COLUMNS = 78;
    const GRID_ROWS = 36;
    const GRID_WIDTH = GRID_COLUMNS * GRID_CELL_SIZE;
    const GRID_HEIGHT = GRID_ROWS * GRID_CELL_SIZE;
    const GRID_TOP = (PC_CANVAS_HEIGHT - GRID_HEIGHT) / 2;
    const GRID_BOTTOM = GRID_TOP + GRID_HEIGHT;
    const GRID_CENTER_X = GRID_WIDTH / 2;
    const GRID_CENTER_Y = GRID_TOP + GRID_HEIGHT / 2;
    const TEST_IMAGE_SOURCE_SIZE = 650;
    const TEST_IMAGE_SCALE = 0.5;
    const TEST_IMAGE_SIZE = TEST_IMAGE_SOURCE_SIZE * TEST_IMAGE_SCALE;
    const FREE_TEXT_DEFAULT_WIDTH = 420;
    const FREE_TEXT_DEFAULT_HEIGHT = 110;
    const BUTTON_DEFAULT_WIDTH = 128;
    const BUTTON_MIN_WIDTH = 128;
    const BUTTON_DEFAULT_HEIGHT = 54;
    const DEFAULT_BUTTON_FONT_SIZE = 7;
    const DEFAULT_TEXT_FONT_SIZE = 12;
    const DEFAULT_TEXT_OPACITY = 100;
    const DEFAULT_FREE_TEXT_COLOR = "#FFFFFF";
    const DEFAULT_BUBBLE_TEXT_COLOR = "#000000";
    const DEFAULT_FREE_TEXT_ALIGN = "left";
    const DEFAULT_BUBBLE_TEXT_ALIGN = "center";
    const TEXT_FONT_SIZE_CANVAS_SCALE = 44 / DEFAULT_TEXT_FONT_SIZE;
    const MIN_TRANSFORM_SIZE = 1;

    const clamp = (value, minimum, maximum) =>
      Math.min(Math.max(value, minimum), Math.max(minimum, maximum));

    let commandTooltipTimer = null;
    let activeCommandTooltipButton = null;
    let commandTooltipAnchorX = 0;
    let commandTooltipAnchorY = 0;

    const hideCommandTooltip = () => {
      window.clearTimeout(commandTooltipTimer);
      activeCommandTooltipButton = null;
      commandTooltip.hidden = true;
    };

    const positionCommandTooltip = () => {
      const cursorGap = 8;
      const edgeGap = 8;
      const tooltipBounds = commandTooltip.getBoundingClientRect();
      const maximumLeft = window.innerWidth - tooltipBounds.width - edgeGap;
      const maximumTop = window.innerHeight - tooltipBounds.height - edgeGap;

      commandTooltip.style.left = `${clamp(
        commandTooltipAnchorX + cursorGap,
        edgeGap,
        maximumLeft
      )}px`;
      commandTooltip.style.top = `${clamp(
        commandTooltipAnchorY + cursorGap,
        edgeGap,
        maximumTop
      )}px`;
    };

    const showCommandTooltip = (button, anchorX, anchorY, delay = 750) => {
      window.clearTimeout(commandTooltipTimer);
      activeCommandTooltipButton = button;
      commandTooltipAnchorX = anchorX;
      commandTooltipAnchorY = anchorY;
      commandTooltipTimer = window.setTimeout(() => {
        if (activeCommandTooltipButton !== button) return;
        commandTooltip.textContent = button.getAttribute("aria-label");
        commandTooltip.hidden = false;
        positionCommandTooltip();
      }, delay);
    };

    commandButtons.forEach((button) => {
      button.addEventListener("pointerenter", (event) => {
        showCommandTooltip(button, event.clientX, event.clientY);
      });
      button.addEventListener("pointermove", (event) => {
        if (activeCommandTooltipButton !== button) return;
        commandTooltipAnchorX = event.clientX;
        commandTooltipAnchorY = event.clientY;
        if (!commandTooltip.hidden) positionCommandTooltip();
      });
      button.addEventListener("pointerleave", hideCommandTooltip);
      button.addEventListener("focus", () => {
        if (!button.matches(":focus-visible")) return;
        const buttonBounds = button.getBoundingClientRect();
        showCommandTooltip(button, buttonBounds.right, buttonBounds.bottom, 0);
      });
      button.addEventListener("blur", hideCommandTooltip);
      button.addEventListener("pointerdown", hideCommandTooltip);
    });

    textMenu.querySelectorAll(".text-menu-icon-static").forEach((icon) => {
      icon.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        hideCommandTooltip();
      });
    });

    const contextCommandButtons = {
      undo: undoButton,
      redo: redoButton,
      cut: cutButton,
      copy: copyButton,
      paste: pasteButton,
      group: groupButton,
      ungroup: ungroupButton,
      mirror: mirrorButton,
      text: textButton,
      delete: deleteButton,
      magnet: magnetButton,
      grid: gridButton
    };
    let editMenuCloseTimer = null;
    let toolsMenuCloseTimer = null;
    let viewMenuCloseTimer = null;
    const visibleCommandBarHeight = getComputedStyle(root).getPropertyValue("--command-height").trim() || "45px";
    let visibleSequenceHeight = getComputedStyle(root).getPropertyValue("--sequence-height").trim() || "156px";

    const syncEditMenuItems = () => {
      editMenuItems.forEach((item) => {
        item.disabled = contextCommandButtons[item.dataset.editCommand].disabled;
      });
    };

    const syncToolsMenuItems = () => {
      toolsMenuItems.forEach((item) => {
        const commandButton = contextCommandButtons[item.dataset.toolsCommand];
        item.disabled = commandButton.disabled;
        if (commandButton.hasAttribute("aria-pressed")) {
          item.setAttribute("aria-pressed", commandButton.getAttribute("aria-pressed"));
        } else {
          item.removeAttribute("aria-pressed");
        }
      });
    };

    const syncViewMenuItems = () => {
      const commandBarVisible = !commandBar.hidden;
      const sequenceVisible = !sequencePanel.hidden;
      viewMenuItems.forEach((item) => {
        const isCommandBar = item.dataset.viewCommand === "command-bar";
        const visible = isCommandBar ? commandBarVisible : sequenceVisible;
        item.setAttribute("aria-pressed", String(visible));
        item.querySelector("img").src = visible
          ? "./icons/visibility-menu-on.png"
          : "./icons/visibility-menu-off.png";
      });
    };

    const setCommandBarVisible = (visible) => {
      commandBar.hidden = !visible;
      layout.dataset.commandBarVisible = String(visible);
      root.style.setProperty("--command-height", visible ? visibleCommandBarHeight : "0px");
      syncViewMenuItems();
    };

    const setSequenceVisible = (visible) => {
      if (!visible && !sequencePanel.hidden) {
        visibleSequenceHeight = getComputedStyle(root).getPropertyValue("--sequence-height").trim() || visibleSequenceHeight;
      }
      sequencePanel.hidden = !visible;
      layout.dataset.sequenceVisible = String(visible);
      root.style.setProperty("--sequence-height", visible ? visibleSequenceHeight : "0px");
      syncViewMenuItems();
    };

    const openEditMenu = () => {
      closeToolsMenu(true);
      closeViewMenu(true);
      window.clearTimeout(editMenuCloseTimer);
      editMenu.classList.remove("is-closing");
      syncEditMenuItems();
      editMenu.hidden = false;
      editMenuButton.setAttribute("aria-expanded", "true");
    };

    const closeEditMenu = (immediate = false) => {
      window.clearTimeout(editMenuCloseTimer);
      editMenuButton.setAttribute("aria-expanded", "false");
      if (editMenu.hidden) return;

      if (immediate) {
        editMenu.hidden = true;
        editMenu.classList.remove("is-closing");
        return;
      }

      editMenu.classList.add("is-closing");
      editMenuCloseTimer = window.setTimeout(() => {
        editMenu.hidden = true;
        editMenu.classList.remove("is-closing");
      }, 140);
    };

    const openToolsMenu = () => {
      closeEditMenu(true);
      closeViewMenu(true);
      window.clearTimeout(toolsMenuCloseTimer);
      toolsMenu.classList.remove("is-closing");
      syncToolsMenuItems();
      toolsMenu.hidden = false;
      toolsMenuButton.setAttribute("aria-expanded", "true");
    };

    const closeToolsMenu = (immediate = false) => {
      window.clearTimeout(toolsMenuCloseTimer);
      toolsMenuButton.setAttribute("aria-expanded", "false");
      if (toolsMenu.hidden) return;

      if (immediate) {
        toolsMenu.hidden = true;
        toolsMenu.classList.remove("is-closing");
        return;
      }

      toolsMenu.classList.add("is-closing");
      toolsMenuCloseTimer = window.setTimeout(() => {
        toolsMenu.hidden = true;
        toolsMenu.classList.remove("is-closing");
      }, 140);
    };

    const openViewMenu = () => {
      closeEditMenu(true);
      closeToolsMenu(true);
      window.clearTimeout(viewMenuCloseTimer);
      viewMenu.classList.remove("is-closing");
      syncViewMenuItems();
      viewMenu.hidden = false;
      viewMenuButton.setAttribute("aria-expanded", "true");
    };

    const closeViewMenu = (immediate = false) => {
      window.clearTimeout(viewMenuCloseTimer);
      viewMenuButton.setAttribute("aria-expanded", "false");
      if (viewMenu.hidden) return;

      if (immediate) {
        viewMenu.hidden = true;
        viewMenu.classList.remove("is-closing");
        return;
      }

      viewMenu.classList.add("is-closing");
      viewMenuCloseTimer = window.setTimeout(() => {
        viewMenu.hidden = true;
        viewMenu.classList.remove("is-closing");
      }, 140);
    };

    editMenuButton.addEventListener("click", () => {
      if (editMenu.hidden || editMenu.classList.contains("is-closing")) {
        openEditMenu();
      } else {
        closeEditMenu();
      }
    });

    editMenuItems.forEach((item) => {
      item.addEventListener("click", () => {
        contextCommandButtons[item.dataset.editCommand].click();
        closeEditMenu();
      });
    });

    toolsMenuButton.addEventListener("click", () => {
      if (toolsMenu.hidden || toolsMenu.classList.contains("is-closing")) {
        openToolsMenu();
      } else {
        closeToolsMenu();
      }
    });

    toolsMenuItems.forEach((item) => {
      item.addEventListener("click", () => {
        contextCommandButtons[item.dataset.toolsCommand].click();
        closeToolsMenu();

      const minimumColumn = Math.ceil((width / 2 - GRID_CENTER_X) / GRID_CELL_SIZE);
      const maximumColumn = Math.floor((PC_CANVAS_WIDTH - width / 2 - GRID_CENTER_X) / GRID_CELL_SIZE);
      const minimumRow = Math.ceil((height / 2 - GRID_CENTER_Y) / GRID_CELL_SIZE);
      const maximumRow = Math.floor((PC_CANVAS_HEIGHT - height / 2 - GRID_CENTER_Y) / GRID_CELL_SIZE);
      const column = clamp(
        Math.round((centerX - GRID_CENTER_X) / GRID_CELL_SIZE),
        minimumColumn,
        maximumColumn
      );
      const row = clamp(
        Math.round((centerY - GRID_CENTER_Y) / GRID_CELL_SIZE),
        minimumRow,
        maximumRow
      );
      let snappedCenterY = GRID_CENTER_Y + row * GRID_CELL_SIZE;

      if (centerY - height / 2 <= GRID_TOP) {
        snappedCenterY = height / 2;
      } else if (centerY + height / 2 >= GRID_BOTTOM) {
        snappedCenterY = PC_CANVAS_HEIGHT - height / 2;
      }

      return {
        centerX: GRID_CENTER_X + column * GRID_CELL_SIZE,
        centerY: snappedCenterY,
        gridX: column,
        gridY: Math.round((GRID_CENTER_Y - snappedCenterY) / GRID_CELL_SIZE),
        objectWidth: width,
        objectHeight: height

      const left = clamp(centerX - width / 2, 0, PC_CANVAS_WIDTH - width);

      const validIds = new Set(getCanvasObjects().map((object) => object.dataset.canvasObjectId));
      activeCanvasObjectIds = new Set(

          .filter((objectId) => validIds.has(objectId))

      const primaryId = primaryObject?.dataset.canvasObjectId;

      getCanvasObjects().forEach((canvasObject) => {

      const selectedObjects = getSelectedCanvasObjects();
      const preferenceTargets = selectedObjects.map((canvasObject) => {

        if (type === "speech-bubble") {

            blur: 0,
            rounding: Number(canvasObject.dataset.bubbleRounding || 0),

            seed: 1,

    const getMaskBlur = (object) => Number(object.dataset.maskBlur || 0);

    const getMaskBlurPixels = (object) => getMaskBlur(object) * 0.32;

    const thoughtBubbleSeedShapes = {
      1: [
        [270, 165, 108], [170, 165, 86], [370, 165, 86],
        [205, 95, 72], [285, 82, 72], [365, 103, 66],
        [205, 225, 72], [290, 238, 72], [375, 220, 66]

      2: [

      4: [

        [190, 112, 68], [290, 100, 72], [382, 115, 64],

      5: [

        [155, 225, 62], [245, 245, 72], [350, 240, 70], [435, 215, 54]

    const explosiveBubbleSeedOnePoints =
      "270,14 318,66 400,28 408,95 522,78 470,145 526,176 430,205 478,318 370,270 325,326 270,280 190,320 180,268 55,310 100,220 18,180 105,145 45,55 175,88 205,24 235,82";

    const explosiveBubbleSeedConfigs = {
      2: { spikes: 8, outerX: 238, outerY: 146, innerX: 150, innerY: 92, phase: -90 },
      3: { spikes: 10, outerX: 242, outerY: 148, innerX: 132, innerY: 82, phase: -81 },
      4: { spikes: 12, outerX: 238, outerY: 145, innerX: 168, innerY: 102, phase: -90 },
      5: { spikes: 14, outerX: 242, outerY: 148, innerX: 148, innerY: 90, phase: -84 }
    };

    const getBubbleSeed = (object) => clamp(
      Math.round(Number(object.dataset.bubbleSeed) || 1),
      1,
      5
    );

    const getExplosiveBubbleSeedPoints = (seed) => {
      if (seed === 1) return explosiveBubbleSeedOnePoints;

      const config = explosiveBubbleSeedConfigs[seed];
      return Array.from({ length: config.spikes * 2 }, (_, index) => {
        const isOuterPoint = index % 2 === 0;
        const angle = (config.phase + index * 180 / config.spikes) * Math.PI / 180;
        const variation = 1 + Math.sin((index + seed) * 1.73) * (isOuterPoint ? 0.055 : 0.035);
        const radiusX = (isOuterPoint ? config.outerX : config.innerX) * variation;
        const radiusY = (isOuterPoint ? config.outerY : config.innerY) * variation;
        const x = 270 + Math.cos(angle) * radiusX;
        const y = 170 + Math.sin(angle) * radiusY;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
    };

    const syncBubbleSeedVisual = (object) => {
      const style = object.dataset.bubbleStyle;
      if (!["thought", "explosive"].includes(style)) return;

      const seed = getBubbleSeed(object);
      const renderKey = `${style}:${seed}`;
      if (object.dataset.bubbleSeedVisual === renderKey) return;

      const svgNamespace = "http://www.w3.org/2000/svg";
      const bubbleSvg = object.querySelector("svg");
      if (!bubbleSvg) return;

      bubbleSvg.replaceChildren();
      if (style === "thought") {
        thoughtBubbleSeedShapes[seed].forEach(([centerX, centerY, radius]) => {
          const cloud = document.createElementNS(svgNamespace, "circle");
          cloud.setAttribute("cx", String(centerX));
          cloud.setAttribute("cy", String(centerY));
          cloud.setAttribute("r", String(radius));
          cloud.dataset.bubbleBody = "thought";
          bubbleSvg.append(cloud);

      } else {
        const explosive = document.createElementNS(svgNamespace, "polygon");
        explosive.setAttribute("points", getExplosiveBubbleSeedPoints(seed));
        explosive.dataset.bubbleBody = "explosive";
        bubbleSvg.append(explosive);
      }

      object.dataset.bubbleSeedVisual = renderKey;
    };

    const getRoundedTrianglePath = (width, height, rounding, centered = true) => {
      const offsetX = centered ? 0 : width / 2;
      const offsetY = centered ? 0 : height / 2;
      const vertices = [
        { x: offsetX, y: offsetY - height / 2 },
        { x: offsetX + width / 2, y: offsetY + height / 2 },
        { x: offsetX - width / 2, y: offsetY + height / 2 }
      ];

      if (rounding <= 0) {
        return `M ${vertices[0].x} ${vertices[0].y} L ${vertices[1].x} ${vertices[1].y} L ${vertices[2].x} ${vertices[2].y} Z`;
      }

      const roundedVertices = vertices.map((vertex, index) => {
        const previous = vertices[(index + vertices.length - 1) % vertices.length];
        const next = vertices[(index + 1) % vertices.length];
        const previousVector = { x: previous.x - vertex.x, y: previous.y - vertex.y };
        const nextVector = { x: next.x - vertex.x, y: next.y - vertex.y };
        const previousLength = Math.hypot(previousVector.x, previousVector.y);
        const nextLength = Math.hypot(nextVector.x, nextVector.y);
        const previousUnit = {
          x: previousVector.x / previousLength,
          y: previousVector.y / previousLength
        };
        const nextUnit = {
          x: nextVector.x / nextLength,
          y: nextVector.y / nextLength
        };
        const angle = Math.acos(clamp(
          previousUnit.x * nextUnit.x + previousUnit.y * nextUnit.y,
          -1,
          1
        ));
        const cornerDistance = Math.min(
          rounding / Math.tan(angle / 2),
          previousLength / 2,
          nextLength / 2
        );
        return {
          vertex,
          start: {
            x: vertex.x + previousUnit.x * cornerDistance,
            y: vertex.y + previousUnit.y * cornerDistance
          },
          end: {
            x: vertex.x + nextUnit.x * cornerDistance,
            y: vertex.y + nextUnit.y * cornerDistance
          }
        };
      });

      return roundedVertices.map((corner, index) => {
        const prefix = index === 0
          ? `M ${corner.start.x} ${corner.start.y}`
          : `L ${corner.start.x} ${corner.start.y}`;
        return `${prefix} Q ${corner.vertex.x} ${corner.vertex.y} ${corner.end.x} ${corner.end.y}`;
      }).join(" ") + " Z";
    };

    const syncMaskObjectPreferenceVisual = (object) => {
      if (object.dataset.canvasObject !== "mask-shape") return;

      const rounding = getMaskRounding(object);
      object.style.filter = `blur(${getMaskBlurPixels(object)}px)`;
      if (object.dataset.maskShape === "circle") {
        object.style.borderRadius = "50%";
        object.style.removeProperty("clip-path");
      } else if (object.dataset.maskShape === "square") {
        object.style.borderRadius = `${Math.min(
          rounding,
          object.offsetWidth / 2,
          object.offsetHeight / 2
        )}px`;
        object.style.removeProperty("clip-path");
      } else {
        object.style.borderRadius = "0";
        object.style.clipPath = `path("${getRoundedTrianglePath(
          object.offsetWidth,
          object.offsetHeight,
          rounding,
          false
        )}")`;
      }
    };

    const syncBubbleObjectPreferenceVisual = (object) => {
      if (object.dataset.canvasObject !== "speech-bubble") return;

      syncBubbleSeedVisual(object);

      const body = object.querySelector('[data-bubble-body="square"]');
      if (!body) return;

      const rounding = clamp(Number(object.dataset.bubbleRounding || 0), 0, 25);
      const viewBox = object.querySelector("svg").viewBox.baseVal;
      const scaleX = viewBox.width / Math.max(object.offsetWidth, 1);
      const scaleY = viewBox.height / Math.max(object.offsetHeight, 1);
      body.setAttribute("rx", String(Math.min(rounding * scaleX, viewBox.width / 2)));
      body.setAttribute("ry", String(Math.min(rounding * scaleY, viewBox.height / 2)));
    };

    const getCanvasSelectionBounds = (objects = getSelectedCanvasObjects()) => {
      if (objects.length === 0) return null;

      const left = Math.min(...objects.map((object) => Number.parseFloat(object.style.left)));
      const top = Math.min(...objects.map((object) => Number.parseFloat(object.style.top)));
      const right = Math.max(...objects.map(
        (object) => Number.parseFloat(object.style.left) + object.offsetWidth
      ));
      const bottom = Math.max(...objects.map(
        (object) => Number.parseFloat(object.style.top) + object.offsetHeight
      ));

      return {
        left,
        top,
        right,
        bottom,
        width: right - left,
        height: bottom - top,
        centerX: (left + right) / 2,
        centerY: (top + bottom) / 2
      };
    };

    const getMaskObjectCutout = (object, index) => {
      const left = Number.parseFloat(object.style.left);
      const top = Number.parseFloat(object.style.top);
      const width = object.offsetWidth;
      const height = object.offsetHeight;
      const centerX = left + width / 2;
      const centerY = top + height / 2;
      const rotation = getObjectRotation(object);
      const mirrorScale = isObjectMirrored(object) ? -1 : 1;
      const transform = `translate(${centerX} ${centerY}) rotate(${rotation}) scale(${mirrorScale} 1)`;
      const filter = getMaskBlur(object) > 0 ? ` filter="url(#mask-blur-${index})"` : "";

      if (object.dataset.maskShape === "circle") {
        return `<ellipse cx="0" cy="0" rx="${width / 2}" ry="${height / 2}" fill="black" transform="${transform}"${filter}/>`;
      }

      if (object.dataset.maskShape === "square") {
        const rounding = Math.min(getMaskRounding(object), width / 2, height / 2);
        return `<rect x="${-width / 2}" y="${-height / 2}" width="${width}" height="${height}" rx="${rounding}" ry="${rounding}" fill="black" transform="${transform}"${filter}/>`;
      }

      if (object.dataset.maskShape === "triangle") {
        return `<path d="${getRoundedTrianglePath(width, height, getMaskRounding(object))}" fill="black" transform="${transform}"${filter}/>`;
      }

      return "";
    };

    const syncMaskLayer = () => {
      const shadeLayer = editorStage.querySelector('[data-cardboard-layer="shade"]');
      if (!shadeLayer) return;

      const maskObjects = getCanvasObjects().filter(
        (object) => object.dataset.canvasObject === "mask-shape"
      );

      if (maskObjects.length === 0) {
        [
          "mask-image",
          "mask-position",
          "mask-repeat",
          "mask-size",
          "-webkit-mask-image",
          "-webkit-mask-position",
          "-webkit-mask-repeat",
          "-webkit-mask-size"
        ].forEach((property) => shadeLayer.style.removeProperty(property));
        delete shadeLayer.dataset.maskShape;
        delete shadeLayer.dataset.maskCount;
        delete editorStage.dataset.maskShape;
        delete editorStage.dataset.maskCount;
        return;
      }

      const filterDefinitions = maskObjects.map((object, index) => {
        const blurPixels = getMaskBlurPixels(object);
        return blurPixels > 0
          ? `<filter id="mask-blur-${index}" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="${blurPixels}"/></filter>`
          : "";
      }).join("");
      const cutouts = maskObjects.map(getMaskObjectCutout).join("");
      const maskSvg = [
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1872 894">',
        `<defs>${filterDefinitions}<mask id="cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1872" height="894" style="mask-type:luminance">`,
        '<rect width="1872" height="894" fill="white"/>',
        cutouts,
        '</mask></defs>',
        '<rect width="1872" height="894" fill="white" mask="url(#cutout)"/>',
        '</svg>'
      ].join("");
      const maskImage = `url("data:image/svg+xml,${encodeURIComponent(maskSvg)}")`;
      const maskShape = maskObjects.length === 1
        ? maskObjects[0].dataset.maskShape
        : "multiple";

      shadeLayer.dataset.maskShape = maskShape;
      shadeLayer.dataset.maskCount = String(maskObjects.length);
      shadeLayer.style.maskImage = maskImage;
      shadeLayer.style.maskPosition = "center";
      shadeLayer.style.maskRepeat = "no-repeat";
      shadeLayer.style.maskSize = "100% 100%";
      shadeLayer.style.webkitMaskImage = maskImage;
      shadeLayer.style.webkitMaskPosition = "center";
      shadeLayer.style.webkitMaskRepeat = "no-repeat";
      shadeLayer.style.webkitMaskSize = "100% 100%";
      editorStage.dataset.maskShape = maskShape;
      editorStage.dataset.maskCount = String(maskObjects.length);
    };

    const syncTransformControls = () => {
      getCanvasObjects().forEach((object) => {
        syncMaskObjectPreferenceVisual(object);
        syncBubbleObjectPreferenceVisual(object);
      });
      syncMaskLayer();
      const selectedObjects = getSelectedCanvasObjects();
      const visible = selectedObjects.length > 0 && isTransformEnabled();
      transformControls.hidden = !visible;
      transformControls.classList.toggle(
        "is-balloon-tail-target",
        selectedObjects.length === 1 && selectedObjects[0].dataset.canvasObject === "balloon-tail"
      );
      transformControls.classList.toggle(
        "is-explosive-target",
        selectedObjects.length === 1 &&
          selectedObjects[0].dataset.canvasObject === "speech-bubble" &&
          selectedObjects[0].dataset.bubbleStyle === "explosive"
      );
      transformControls.classList.toggle(
        "is-free-text-target",
        selectedObjects.length === 1 &&
          selectedObjects[0].dataset.canvasObject === "free-text"
      );
      transformControls.classList.toggle(
        "is-button-target",
        selectedObjects.some((object) => object.dataset.canvasObject === "button")
      );
      transformControls.classList.toggle(
        "is-rotation-disabled",
        selectedObjects.some((object) => object.dataset.canvasObject === "button")
      );
      const selectedTail = selectedObjects.length === 1 &&
        selectedObjects[0].dataset.canvasObject === "balloon-tail"
        ? selectedObjects[0]
        : null;
      if (selectedTail) {
        const tailDefaults = balloonTailDefaults[selectedTail.dataset.balloonTailType];
        transformControls.style.setProperty(
          "--balloon-tail-tip-position",
          `${tailDefaults.tipX / tailDefaults.viewBoxWidth * 100}%`
        );
      } else {
        transformControls.style.removeProperty("--balloon-tail-tip-position");
      }
      if (!visible) return;

      if (selectedObjects.length === 1) {
        const [object] = selectedObjects;
        transformControls.style.left = object.style.left;
        transformControls.style.top = object.style.top;
        transformControls.style.width = `${object.offsetWidth}px`;
        transformControls.style.height = `${object.offsetHeight}px`;
        transformControls.style.transform = `rotate(${getObjectRotation(object)}deg)`;
        return;
      }

      const bounds = getCanvasSelectionBounds(selectedObjects);
      transformControls.style.left = `${bounds.left}px`;
      transformControls.style.top = `${bounds.top}px`;
      transformControls.style.width = `${bounds.width}px`;
      transformControls.style.height = `${bounds.height}px`;
      transformControls.style.transform = "rotate(0deg)";
    };

    const syncMirrorButtonState = () => {
      const selectedObjects = getSelectedCanvasObjects();
      const hasMirrorTarget =
        selectedObjects.length > 0 &&
        isTransformEnabled() &&
        selectedObjects.every((object) =>
          !["free-text", "button"].includes(object.dataset.canvasObject)
        );
      mirrorButton.disabled = !hasMirrorTarget;
      mirrorButton.setAttribute(
        "aria-pressed",
        String(hasMirrorTarget && selectedObjects.every(isObjectMirrored))
      );
    };

    const syncClipboardButtonState = () => {
      const hasTransformTarget = getSelectedCanvasObjects().length > 0 && isTransformEnabled();
      cutButton.disabled = !hasTransformTarget;
      copyButton.disabled = !hasTransformTarget;
      pasteButton.disabled = canvasClipboard === null;
    };

    const syncGroupButtonsState = () => {
      const selectedObjects = getSelectedCanvasObjects();
      const selectedGroupIds = new Set(
        selectedObjects.map((object) => object.dataset.canvasGroupId).filter(Boolean)
      );
      const onlyGroupId = Array.from(selectedGroupIds)[0] || null;
      const isOneCompleteGroup =
        selectedGroupIds.size === 1 &&
        selectedObjects.every((object) => object.dataset.canvasGroupId === onlyGroupId) &&
        selectedObjects.length === getCanvasObjects().filter(
          (object) => object.dataset.canvasGroupId === onlyGroupId
        ).length;

      groupButton.disabled = selectedObjects.length < 2 || isOneCompleteGroup;
      ungroupButton.disabled = selectedGroupIds.size === 0;
    };

    const setTransformMode = (enabled) => {
      const object = enabled ? ensureActiveCanvasObject() : getActiveCanvasObject();
      const active = enabled && Boolean(object) && getSelectedCanvasObjects().length > 0;
      transformButton.setAttribute("aria-pressed", String(active));
      syncTransformControls();
      syncMirrorButtonState();
      syncClipboardButtonState();
      syncGroupButtonsState();
    };

    editorStage.addEventListener("pointerdown", (event) => {
      if (
        event.button !== 0 ||
        event.target.closest("[data-canvas-object]") ||
        transformControls.contains(event.target)
      ) return;

      event.preventDefault();
      hideContextMenu();
      hideMagnetGuide();

      const pointerId = event.pointerId;
      const stageBounds = editorStage.getBoundingClientRect();
      const startClientPoint = {
        x: clamp(event.clientX, stageBounds.left, stageBounds.right),
        y: clamp(event.clientY, stageBounds.top, stageBounds.bottom)
      };
      const startStagePoint = getStagePoint(startClientPoint.x, startClientPoint.y);
      const initialSelection = getSelectedCanvasObjects();
      const additiveSelection = event.shiftKey ? initialSelection : [];
      let isMarqueeDragging = false;

      if (!event.shiftKey) {
        setCanvasSelection([]);
        setTransformMode(false);
      }

      const selectObjectsInsideMarquee = (clientX, clientY) => {
        const currentClientPoint = {
          x: clamp(clientX, stageBounds.left, stageBounds.right),
          y: clamp(clientY, stageBounds.top, stageBounds.bottom)
        };
        const currentStagePoint = getStagePoint(currentClientPoint.x, currentClientPoint.y);
        const selectionClientBounds = {
          left: Math.min(startClientPoint.x, currentClientPoint.x),
          top: Math.min(startClientPoint.y, currentClientPoint.y),
          right: Math.max(startClientPoint.x, currentClientPoint.x),
          bottom: Math.max(startClientPoint.y, currentClientPoint.y)
        };
        const selectionIds = new Set(additiveSelection.map(
          (object) => object.dataset.canvasObjectId
        ));

        selectionMarquee.style.left = `${Math.min(startStagePoint.x, currentStagePoint.x)}px`;
        selectionMarquee.style.top = `${Math.min(startStagePoint.y, currentStagePoint.y)}px`;
        selectionMarquee.style.width = `${Math.abs(currentStagePoint.x - startStagePoint.x)}px`;
        selectionMarquee.style.height = `${Math.abs(currentStagePoint.y - startStagePoint.y)}px`;

        getCanvasObjects().forEach((object) => {
          const objectBounds = object.getBoundingClientRect();
          const intersectsSelection =
            objectBounds.right >= selectionClientBounds.left &&
            objectBounds.left <= selectionClientBounds.right &&
            objectBounds.bottom >= selectionClientBounds.top &&
            objectBounds.top <= selectionClientBounds.bottom;
          if (!intersectsSelection) return;

          getCanvasGroupObjects(object).forEach((relatedObject) => {
            selectionIds.add(relatedObject.dataset.canvasObjectId);
          });
        });

        const selectedObjects = getCanvasObjects().filter((object) =>
          selectionIds.has(object.dataset.canvasObjectId)
        );
        setCanvasSelection(selectedObjects, selectedObjects.at(-1) || null);
        transformControls.hidden = true;
      };

      const moveMarqueeSelection = (moveEvent) => {
        if (moveEvent.pointerId !== pointerId) return;

        if (!isMarqueeDragging) {
          const distance = Math.hypot(
            moveEvent.clientX - startClientPoint.x,
            moveEvent.clientY - startClientPoint.y
          );
          if (distance < 4) return;

          isMarqueeDragging = true;
          selectionMarquee.hidden = false;
          document.body.dataset.marqueeSelecting = "true";
        }

        selectObjectsInsideMarquee(moveEvent.clientX, moveEvent.clientY);
      };

      const cleanupMarqueeSelection = () => {
        selectionMarquee.hidden = true;
        selectionMarquee.removeAttribute("style");
        delete document.body.dataset.marqueeSelecting;
        window.removeEventListener("pointermove", moveMarqueeSelection);
        window.removeEventListener("pointerup", finishMarqueeSelection);
        window.removeEventListener("pointercancel", cancelMarqueeSelection);
        if (editorStage.hasPointerCapture(pointerId)) {
          editorStage.releasePointerCapture(pointerId);
        }
      };

      const finishMarqueeSelection = (finishEvent) => {
        if (finishEvent.pointerId !== pointerId) return;

        if (isMarqueeDragging) {
          selectObjectsInsideMarquee(finishEvent.clientX, finishEvent.clientY);
        }
        cleanupMarqueeSelection();
        setTransformMode(getSelectedCanvasObjects().length > 0);
        updateHistoryButtons();
      };

      const cancelMarqueeSelection = (cancelEvent) => {
        if (cancelEvent.pointerId !== pointerId) return;

        setCanvasSelection(initialSelection, initialSelection.at(-1) || null);
        cleanupMarqueeSelection();
        setTransformMode(initialSelection.length > 0);
        updateHistoryButtons();
      };

      editorStage.setPointerCapture(pointerId);
      window.addEventListener("pointermove", moveMarqueeSelection);
      window.addEventListener("pointerup", finishMarqueeSelection);
      window.addEventListener("pointercancel", cancelMarqueeSelection);
    });

    const canvasHistory = [{ objects: [], activeId: null, activeIds: [] }];
    let canvasHistoryIndex = 0;

    const getCanvasState = () => {
      return {
        activeId: getActiveCanvasObject()?.dataset.canvasObjectId || null,
        activeIds: getSelectedCanvasObjects().map((object) => object.dataset.canvasObjectId),
        objects: getCanvasObjects().map(getCanvasObjectState)
      };
    };

    const canvasStatesMatch = (first, second) => {
      if (first.objects.length !== second.objects.length) return false;
      return first.objects.every((object, index) => {
        const comparedObject = second.objects[index];
        return (
          object.id === comparedObject.id &&
          object.type === comparedObject.type &&
          object.shape === comparedObject.shape &&
          object.parentBubbleId === comparedObject.parentBubbleId &&
          object.groupId === comparedObject.groupId &&
          object.blur === comparedObject.blur &&
          object.rounding === comparedObject.rounding &&
          object.seed === comparedObject.seed &&
          object.text === comparedObject.text &&
          object.html === comparedObject.html &&
          object.fontSize === comparedObject.fontSize &&
          object.opacity === comparedObject.opacity &&
          object.color === comparedObject.color &&
          object.align === comparedObject.align &&
          object.left === comparedObject.left &&
          object.top === comparedObject.top &&
          object.width === comparedObject.width &&
          object.height === comparedObject.height &&
          object.rotation === comparedObject.rotation &&
          object.mirrored === comparedObject.mirrored
        );
      });
    };

    const updateHistoryButtons = () => {
      const selectedObjects = getSelectedCanvasObjects();
      const hasObject = getCanvasObjects().length > 0;
      undoButton.disabled = canvasHistoryIndex === 0;
      redoButton.disabled = canvasHistoryIndex === canvasHistory.length - 1;
      transformButton.disabled = !hasObject;
      deleteButton.disabled = selectedObjects.length === 0 || !isTransformEnabled();
      syncMirrorButtonState();
      syncClipboardButtonState();
      syncGroupButtonsState();

      if (!hasObject && canvasClipboard === null && isTransformEnabled()) {
        setTransformMode(false);
      } else {
        syncTransformControls();
      }
    };

    const recordCanvasState = () => {
      const state = getCanvasState();
      if (canvasStatesMatch(state, canvasHistory[canvasHistoryIndex])) return;

      canvasHistory.splice(canvasHistoryIndex + 1);
      canvasHistory.push(state);
      canvasHistoryIndex = canvasHistory.length - 1;
      updateHistoryButtons();
    };

    let activeTextMenuObject = null;
    let activeTextMenuContent = null;
    let activeTextSelectionRange = null;
    let activeTextColorRange = null;
    let textMenuCommitTimer = null;

    const normalizeTextFontSize = (value, fallback = DEFAULT_TEXT_FONT_SIZE) => {
      const parsedValue = Number(value);
      return Number.isFinite(parsedValue)
        ? clamp(Math.round(parsedValue), 1, 999)
        : fallback;
    };

    const normalizeTextOpacity = (value, fallback = DEFAULT_TEXT_OPACITY) => {
      const parsedValue = Number(value);
      return Number.isFinite(parsedValue)
        ? clamp(Math.round(parsedValue), 0, 100)
        : fallback;
    };

    const getDefaultTextColor = (object) =>
      object?.dataset.canvasObject === "speech-bubble"
        ? DEFAULT_BUBBLE_TEXT_COLOR
        : DEFAULT_FREE_TEXT_COLOR;

    const normalizeTextColor = (value, fallback = DEFAULT_FREE_TEXT_COLOR) => {
      const normalizedValue = String(value || "").trim().toUpperCase();
      return /^#[0-9A-F]{6}$/.test(normalizedValue) ? normalizedValue : fallback;
    };

    const getDefaultTextAlign = (object) =>
      object?.dataset.canvasObject === "speech-bubble"
        ? DEFAULT_BUBBLE_TEXT_ALIGN
        : DEFAULT_FREE_TEXT_ALIGN;

    const normalizeTextAlign = (value, fallback = DEFAULT_FREE_TEXT_ALIGN) => {
      const normalizedValue = String(value || "").trim().toLowerCase();
      return ["left", "center", "right"].includes(normalizedValue)
        ? normalizedValue
        : fallback;
    };

    const syncTextColorSelection = (color) => {
      const normalizedColor = normalizeTextColor(color);
      textColorOptions.querySelectorAll("[data-text-color-value]").forEach((swatch) => {
        swatch.setAttribute(
          "aria-checked",
          String(swatch.dataset.textColorValue === normalizedColor)
        );
      });
    };

    const getActiveTextSelectionRange = () => {
      if (!activeTextMenuContent || activeTextMenuContent.contentEditable !== "true") {
        return null;
      }

      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return null;
      const range = selection.getRangeAt(0);
      if (
        !activeTextMenuContent.contains(range.startContainer) ||
        !activeTextMenuContent.contains(range.endContainer)
      ) return null;
      return range;
    };

    const activeTextRangeTouches = (selector) => {
      const range = getActiveTextSelectionRange() || activeTextSelectionRange;
      if (!range || !activeTextMenuContent) return false;

      return Array.from(activeTextMenuContent.querySelectorAll(selector)).some((element) => {
        try {
          return range.intersectsNode(element);
        } catch {
          return false;
        }
      });
    };

    const syncTextFormatButtonStates = () => {
      const isEditing = Boolean(
        activeTextMenuContent && activeTextMenuContent.contentEditable === "true"
      );
      const isButtonEditing = isEditing &&
        activeTextMenuObject?.dataset.canvasObject === "button";
      [...textFormatButtons, ...textAlignmentButtons].forEach((button) => {
        button.disabled = !isEditing || isButtonEditing;
      });
      textOpacityInput.disabled = !isEditing || isButtonEditing;

      const queryCommandState = (command) => {
        if (!isEditing || isButtonEditing) return false;
        try {
          return document.queryCommandState(command);
        } catch {
          return false;
        }
      };

      boldTextButton.setAttribute("aria-pressed", String(queryCommandState("bold")));
      italicTextButton.setAttribute("aria-pressed", String(queryCommandState("italic")));
      underlineTextButton.setAttribute("aria-pressed", String(queryCommandState("underline")));
      bulletTextButton.setAttribute(
        "aria-pressed",
        String(queryCommandState("insertUnorderedList"))
      );
      quoteTextButton.setAttribute(
        "aria-pressed",
        String(isEditing && !isButtonEditing && activeTextRangeTouches(".md-quote"))
      );
      const textAlign = isEditing && !isButtonEditing
        ? normalizeTextAlign(
          activeTextMenuObject?.dataset.textAlign,
          getDefaultTextAlign(activeTextMenuObject)
        )
        : null;
      alignLeftTextButton.setAttribute("aria-pressed", String(textAlign === "left"));
      alignCenterTextButton.setAttribute("aria-pressed", String(textAlign === "center"));
      alignRightTextButton.setAttribute("aria-pressed", String(textAlign === "right"));
    };

    const rememberActiveTextSelection = () => {
      const range = getActiveTextSelectionRange();
      activeTextSelectionRange = range ? range.cloneRange() : null;
      activeTextColorRange = range && !range.collapsed ? range.cloneRange() : null;
      textColorButton.disabled =
        activeTextMenuObject?.dataset.canvasObject === "button" || !activeTextColorRange;
      syncTextFormatButtonStates();
      return activeTextColorRange;
    };

    const restoreActiveTextSelection = () => {
      if (
        !activeTextMenuContent ||
        !activeTextSelectionRange ||
        !activeTextMenuContent.contains(activeTextSelectionRange.startContainer) ||
        !activeTextMenuContent.contains(activeTextSelectionRange.endContainer)
      ) return false;

      activeTextMenuContent.focus({ preventScroll: true });
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(activeTextSelectionRange.cloneRange());
      return true;
    };

    const syncCanvasTextStyle = (object, textContent) => {
      const fontSize = normalizeTextFontSize(object.dataset.textFontSize);
      if (object.dataset.canvasObject === "button") {
        object.dataset.textFontSize = String(fontSize);
        textContent.style.fontSize = `${fontSize * TEXT_FONT_SIZE_CANVAS_SCALE}px`;
        return;
      }
      const opacity = normalizeTextOpacity(object.dataset.textOpacity);
      const color = normalizeTextColor(object.dataset.textColor, getDefaultTextColor(object));
      const align = normalizeTextAlign(object.dataset.textAlign, getDefaultTextAlign(object));
      object.dataset.textFontSize = String(fontSize);
      object.dataset.textOpacity = String(opacity);
      object.dataset.textColor = color;
      object.dataset.textAlign = align;
      textContent.style.fontSize = `${fontSize * TEXT_FONT_SIZE_CANVAS_SCALE}px`;
      textContent.style.opacity = String(opacity / 100);
      textContent.style.color = color;
      textContent.style.textAlign = align;
      if (object.dataset.canvasObject === "speech-bubble") {
        textContent.style.justifyContent = align === "left"
          ? "flex-start"
          : align === "right" ? "flex-end" : "center";
      }
    };

    const closeTextMenuOptions = () => {
      textFontSizeOptions.hidden = true;
      textOpacityOptions.hidden = true;
      textColorOptions.hidden = true;
      textColorButton.setAttribute("aria-expanded", "false");
    };

    const showTextMenu = (object, textContent) => {
      activeTextMenuObject = object;
      activeTextMenuContent = textContent;
      const isButtonText = object.dataset.canvasObject === "button";
      syncCanvasTextStyle(object, textContent);
      textFontSizeInput.value = object.dataset.textFontSize;
      textOpacityInput.value = isButtonText
        ? String(DEFAULT_TEXT_OPACITY)
        : object.dataset.textOpacity;
      syncTextColorSelection(isButtonText ? "#773421" : object.dataset.textColor);
      closeTextMenuOptions();
      activeTextSelectionRange = null;
      activeTextColorRange = null;
      textColorButton.disabled = true;
      textMenu.dataset.fontSizeOnly = String(isButtonText);
      textMenu.hidden = false;
      syncTextFormatButtonStates();
    };

    const hideTextMenu = () => {
      window.clearTimeout(textMenuCommitTimer);
      closeTextMenuOptions();
      textMenu.hidden = true;
      delete textMenu.dataset.fontSizeOnly;
      activeTextMenuObject = null;
      activeTextMenuContent = null;
      activeTextSelectionRange = null;
      activeTextColorRange = null;
      textColorButton.disabled = true;
      syncTextFormatButtonStates();
    };

    const syncCanvasTextContentState = (object, textContent) => {
      const nextText = textContent.textContent || "";
      if (object.dataset.canvasObject === "speech-bubble") {
        object.dataset.bubbleText = nextText;
      } else if (object.dataset.canvasObject === "free-text") {
        object.dataset.freeText = nextText;
      } else if (object.dataset.canvasObject === "button") {
        object.dataset.buttonText = nextText;
      }
      object.dataset.textHtml = textContent.innerHTML;
    };

    const finishCanvasTextEditing = (textContent) => {
      const object = textContent?.closest("[data-canvas-object]");
      if (!object || textContent.contentEditable !== "true") return;

      syncCanvasTextContentState(object, textContent);
      textContent.contentEditable = "false";
      if (activeTextMenuContent === textContent) hideTextMenu();
      if (object.isConnected) {
        setCanvasSelection([object], object);
        setTransformMode(true);
        updateHistoryButtons();
      }
      recordCanvasState();
    };

    const applyActiveTextMenuValue = (kind, rawValue, commit = false) => {
      if (!activeTextMenuObject || !activeTextMenuContent) return;

      const isFontSize = kind === "font-size";
      if (!isFontSize && activeTextMenuObject.dataset.canvasObject === "button") return;
      const currentValue = isFontSize
        ? Number(activeTextMenuObject.dataset.textFontSize || DEFAULT_TEXT_FONT_SIZE)
        : Number(activeTextMenuObject.dataset.textOpacity || DEFAULT_TEXT_OPACITY);
      const normalizedValue = isFontSize
        ? normalizeTextFontSize(rawValue, currentValue)
        : normalizeTextOpacity(rawValue, currentValue);
      const datasetKey = isFontSize ? "textFontSize" : "textOpacity";
      const input = isFontSize ? textFontSizeInput : textOpacityInput;
      activeTextMenuObject.dataset[datasetKey] = String(normalizedValue);
      syncCanvasTextStyle(activeTextMenuObject, activeTextMenuContent);
      if (commit) input.value = String(normalizedValue);

      window.clearTimeout(textMenuCommitTimer);
      if (commit) {
        recordCanvasState();
      } else {
        textMenuCommitTimer = window.setTimeout(recordCanvasState, 240);
      }
    };

    const fillTextMenuOptions = (container, values, kind, input) => {
      values.forEach((value) => {
        const option = document.createElement("button");
        option.className = "text-menu-option";
        option.type = "button";
        option.role = "menuitem";
        option.textContent = String(value);
        option.addEventListener("click", () => {
          input.value = String(value);
          applyActiveTextMenuValue(kind, value, true);
          closeTextMenuOptions();
          input.focus();
        });
        container.append(option);
      });
    };

    fillTextMenuOptions(
      textFontSizeOptions,
      Array.from({ length: 15 }, (_, index) => index + 6),
      "font-size",
      textFontSizeInput
    );
    fillTextMenuOptions(
      textOpacityOptions,
      [100, 75, 50, 25, 0],
      "opacity",
      textOpacityInput
    );

    const textColorPalettes = [
      { name: "Tema", colors: ["#2B2523", "#3D251F", "#5F2F21"] },
      { name: "Icono", colors: ["#773421", "#A56243", "#EFB775", "#FFE2C1"] },
      { name: "Matsu", colors: ["#EF5350", "#64B5F6", "#9CCC65", "#BA68C8", "#FFD54F", "#F06292"] },
      { name: "B/N", colors: ["#FFFFFF", "#000000"] },

    const applyActiveTextColor = (rawColor) => {
      if (
        !activeTextMenuObject ||
        activeTextMenuObject.dataset.canvasObject === "button" ||
        !activeTextMenuContent ||
        !activeTextColorRange ||
        activeTextColorRange.collapsed ||
        !activeTextMenuContent.contains(activeTextColorRange.startContainer) ||
        !activeTextMenuContent.contains(activeTextColorRange.endContainer)
      ) return;

      const color = normalizeTextColor(rawColor, getDefaultTextColor(activeTextMenuObject));
      syncCanvasTextContentState(activeTextMenuObject, activeTextMenuContent);
      recordCanvasState();
      const selection = window.getSelection();
      const range = activeTextColorRange.cloneRange();
      const fragment = range.extractContents();
      fragment.querySelectorAll("[data-text-color-span]").forEach((colorFragment) => {
        colorFragment.replaceWith(...colorFragment.childNodes);
      });
      const colorSpan = document.createElement("span");
      colorSpan.dataset.textColorSpan = color;
      colorSpan.style.color = color;
      colorSpan.append(fragment);
      range.insertNode(colorSpan);

      const selectedRange = document.createRange();
      selectedRange.selectNodeContents(colorSpan);
      selection.removeAllRanges();
      selection.addRange(selectedRange);
      activeTextSelectionRange = selectedRange.cloneRange();
      activeTextColorRange = selectedRange.cloneRange();
      syncCanvasTextContentState(activeTextMenuObject, activeTextMenuContent);
      syncTextColorSelection(color);
      textColorOptions.hidden = false;
      textColorButton.setAttribute("aria-expanded", "true");
      activeTextMenuContent.focus({ preventScroll: true });
      textColorButton.disabled = false;
      recordCanvasState();
    };

    textColorPalettes.forEach((palette) => {
      const row = document.createElement("span");
      const label = document.createElement("span");

      row.className = "text-color-palette-row";
      label.className = "text-color-palette-label";
      label.textContent = palette.name;
      swatches.className = "text-color-palette-swatches";

      palette.colors.forEach((color) => {

        swatch.type = "button";
        swatch.role = "menuitemradio";

          event.stopPropagation();
          applyActiveTextColor(color);

        swatches.append(swatch);

      const range = getActiveTextSelectionRange();

      activeTextMenuContent.querySelectorAll(selector).forEach((element) => {
        try {
          if (range.intersectsNode(element)) element.classList.add(className);

        !restoreActiveTextSelection()

      recordCanvasState();

        addMarkdownClassToSelectedElements("ul", "dex-bullet-list");
      } else if (format === "quote") {

      root.style.setProperty("--magnet-bubble-border-width", `${2 / scale}px`);
      root.style.setProperty("--coordinate-label-stroke", `${0.45 / scale}px`);
      root.style.setProperty("--transform-handle-size", `${12 / scale}px`);

    const groupSelectedCanvasObjects = () => {
      const selectedObjects = getSelectedCanvasObjects();
      if (selectedObjects.length < 2 || groupButton.disabled) return;

      const groupId = `group-${nextCanvasGroupId++}`;
      selectedObjects.forEach((object) => {
        object.dataset.canvasGroupId = groupId;

      setCanvasSelection(selectedObjects, getActiveCanvasObject());
