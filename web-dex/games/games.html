<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Games | CreatureMatsu Dex</title>
  <link rel="icon" type="image/png" href="../images/icon.png">
  <link rel="stylesheet" href="../home-data/style/layout.css?v=20260903-global-markdown">
  <link rel="stylesheet" href="../home-data/new.css?v=20261009-matsu-quiz-new">
  <link rel="stylesheet" href="games.css?v=20261012-palettes-front">
  <link rel="stylesheet" href="games-layering.css?v=20261012-stars-close-arc">
</head>
<body class="games-standalone">

  <script src="../analytics.js?v=20260911-all-content-routes"></script>
  <script defer data-disable-auto-track="true" src="/_vercel/insights/script.js"></script>

  <main class="games" id="gamesPage" aria-hidden="true">
    <div class="games-stage">
      <div class="games-window" aria-label="Games view">
        <button class="games-back-btn" type="button" data-close-games>
          BACK
        </button>

        <div class="games-menu">
          <div class="games-list" aria-label="Games content">
            <button
              class="games-list-btn games-list-btn--matsu-quiz new-feature-anchor"
              type="button"
              data-game-content="matsu-quiz"
            >
              <span class="games-quiz-fireworks games-quiz-fireworks--left" aria-hidden="true">
                <span class="games-quiz-star games-quiz-star--left-1"></span>
                <span class="games-quiz-star games-quiz-star--left-2"></span>
                <span class="games-quiz-star games-quiz-star--left-3"></span>
                <span class="games-quiz-star games-quiz-star--left-4"></span>
                <span class="games-quiz-star games-quiz-star--left-5"></span>
              </span>
              <img
                class="games-quiz-palette games-quiz-palette--o"
                src="/games/matsu-quiz/quiz-images/O.png"
                alt=""
                aria-hidden="true"
              >
              <span class="games-list-text">Matsu Quiz</span>
              <img
                class="games-quiz-palette games-quiz-palette--x"
                src="/games/matsu-quiz/quiz-images/X.png"
                alt=""
                aria-hidden="true"
              >
              <span class="games-quiz-fireworks games-quiz-fireworks--right" aria-hidden="true">
                <span class="games-quiz-star games-quiz-star--right-1"></span>
                <span class="games-quiz-star games-quiz-star--right-2"></span>
                <span class="games-quiz-star games-quiz-star--right-3"></span>
                <span class="games-quiz-star games-quiz-star--right-4"></span>
                <span class="games-quiz-star games-quiz-star--right-5"></span>
              </span>
              <span class="new-feature-badge new-feature-badge-corner matsu-quiz-new-badge" aria-hidden="true">NEW</span>
            </button>

            <button class="games-list-btn games-list-btn--disabled" type="button" disabled><span class="games-list-text">TBA</span></button>
            <button class="games-list-btn games-list-btn--disabled" type="button" disabled><span class="games-list-text">TBA</span></button>
            <button class="games-list-btn games-list-btn--disabled" type="button" disabled><span class="games-list-text">TBA</span></button>
            <button class="games-list-btn games-list-btn--disabled" type="button" disabled><span class="games-list-text">TBA</span></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../home-data/new.js?v=20261009-matsu-quiz-new"></script>
    <script src="games.js?v=20261019-matsu-quiz-clean-route"></script>
</body>
</html>
